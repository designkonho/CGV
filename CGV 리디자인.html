<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGV 리디자인</title>
<style>
:root{--bg:#fff;--fg:#111;--gray:#242424;--hd:#242424;--ph:#242424;--soft:#242424;--card:#fff;--line:#e3e3e3;--dim:rgba(0,0,0,.6);--red:#FF0001;--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--fg:#f2f2f2;--card:#1a1a1a;--line:#333;--dim:rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--bg:#0d0d0d;--fg:#f2f2f2;--card:#1a1a1a;--line:#333;--dim:rgba(0,0,0,.75)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 58px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;transition:background .5s var(--ease),color .5s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease),opacity .35s var(--ease)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{cursor:not-allowed}

/* 상단 헤더 & 우측 끝 레드 스트로크 검색 아이콘 */
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;height:58px;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 2px 12px rgba(0,0,0,.28)}
.logo-btn{display:flex;align-items:center;padding:0;flex:none}
.logo-img{height:28px;display:block}
.hd-right{display:flex;align-items:center;gap:6px;margin-left:auto}
nav{display:flex;gap:2px;flex:none}
nav button{padding:6px 10px;font-size:13px;border-radius:6px;white-space:nowrap}
nav button:hover,nav button.on{background:rgba(255,255,255,.14)}
nav button.on{color:var(--red)}
.nav-search{width:36px;height:36px;border-radius:999px;border:1.5px solid var(--red);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;margin-left:4px;flex:none}
.nav-search:hover{background:rgba(255,0,1,.14);transform:scale(1.05)}
.nav-search svg{width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.backbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:0;right:0;height:0;z-index:25}
.btn-back{position:absolute;left:18px;top:12px;padding:8px 16px;font-size:13px;font-weight:600;border-radius:999px;background:var(--gray);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.btn-back:hover{background:var(--red)}
.hidden{display:none!important}
.ph{position:relative;background:var(--ph);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;color:#fff;padding:8px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .45s var(--ease);z-index:1}
.ph span.label{position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.8);opacity:0;transition:opacity .45s var(--ease);padding:0 4px}
.ph:hover::after,.ph:hover span.label{opacity:1}

section.page{display:none;min-height:calc(100vh - 58px);padding-top:58px}
section.page.on{display:block;animation:pageFadeIn .75s var(--ease) forwards}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* 히어로 회전 스테이지 & 대형 물결 블러 배경 */
.hero-wrap{position:relative;overflow:hidden;background:#0d0d10}
.stage-bg{position:absolute;inset:-140px;background-size:cover;background-position:center;filter:blur(56px) brightness(.44) saturate(1.3);transform:scale(1.36);transition:background-image .95s var(--ease);animation:waveBlur 11s ease-in-out infinite;z-index:0;pointer-events:none;will-change:transform}
.stage-wave{position:absolute;inset:-140px;background:radial-gradient(circle at 35% 40%,rgba(255,255,255,.09),transparent 55%),radial-gradient(circle at 70% 65%,rgba(255,0,1,.12),transparent 60%);mix-blend-mode:screen;animation:waveShimmer 8s ease-in-out infinite alternate;z-index:0;pointer-events:none}
.stage-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.18),rgba(0,0,0,.68))}
@keyframes waveBlur{
  0%{transform:scale(1.36) translate3d(-2.5%,-1.5%,0) rotate(-1.2deg)}
  33%{transform:scale(1.45) translate3d(2.4%,-2.2%,0) rotate(1.1deg)}
  66%{transform:scale(1.39) translate3d(1.6%,2.4%,0) rotate(-.7deg)}
  100%{transform:scale(1.36) translate3d(-2.5%,-1.5%,0) rotate(-1.2deg)}
}
@keyframes waveShimmer{
  0%{transform:translate3d(-3%,2%,0) scale(1.1);opacity:.55}
  50%{transform:translate3d(3%,-2%,0) scale(1.22);opacity:.9}
  100%{transform:translate3d(-1%,-3%,0) scale(1.12);opacity:.6}
}
.stage{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:76px 16px 36px;min-height:560px;overflow:hidden}
.stage-track{--s1:clamp(120px,21vw,330px);--s2:calc(var(--s1)*1.8);position:relative;width:100%;height:400px;display:flex;align-items:center;justify-content:center}
.stage .ph{position:absolute;width:clamp(70px,11vw,168px);aspect-ratio:7/10;font-size:13px;border-radius:12px;opacity:0;pointer-events:none;transform:scale(.8);z-index:1;transition:transform .85s var(--ease),width .85s var(--ease),opacity .85s var(--ease),box-shadow .85s var(--ease)}
.stage .ph[data-pos="-2"]{transform:translateX(calc(var(--s2)*-1)) scale(.85);opacity:.4;pointer-events:auto}
.stage .ph[data-pos="-1"]{transform:translateX(calc(var(--s1)*-1)) scale(.95);opacity:.75;pointer-events:auto;z-index:2}
.stage .ph[data-pos="0"]{width:clamp(110px,17vw,256px);aspect-ratio:256/362;font-size:18px;transform:none;opacity:1;pointer-events:auto;box-shadow:0 18px 48px rgba(0,0,0,.6);z-index:5}
.stage .ph[data-pos="1"]{transform:translateX(var(--s1)) scale(.95);opacity:.75;pointer-events:auto;z-index:2}
.stage .ph[data-pos="2"]{transform:translateX(var(--s2)) scale(.85);opacity:.4;pointer-events:auto}
.ctl{position:relative;z-index:1;display:flex;justify-content:center;gap:12px;padding-bottom:56px;flex-wrap:wrap}
.ctl button,.pill-btn{padding:10px 20px;border-radius:999px;background:var(--gray);color:#fff;font-size:14px;font-weight:500}
.ctl button:hover,.ctl .red,.pill-btn:hover,.pill-btn.on,.pill-btn.go{background:var(--red)}

/* 큐레이션 & 스무스 페이드 전환 */
.curation-sec{max-width:1100px;margin:0 auto;padding:44px 24px 80px}
.curation-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.curation-head h2{margin:0;font-size:24px;font-weight:700}
.curation-head .more-btn{font-size:14px;color:#888}
.curation-head .more-btn:hover{color:var(--red)}
.curation-body{display:grid;grid-template-columns:280px 1fr;gap:36px;align-items:start}
.curation-fade{transition:opacity .48s var(--ease),transform .48s var(--ease)}
.curation-fade.switching{opacity:0;transform:translateY(10px)}
.curation-left{display:flex;flex-direction:column;gap:16px}
.curation-left .poster-box{width:100%;aspect-ratio:256/362;border-radius:12px;position:relative;box-shadow:0 10px 28px rgba(0,0,0,.18)}
.badge-tag{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:4px;z-index:3}
.curation-left .actions{display:flex;gap:10px}
.curation-left .actions button{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.curation-left .actions button:hover{background:rgba(128,128,128,.15)}
.curation-left .actions button.btn-book{background:var(--red);color:#fff;border:none}
.curation-left .actions button.btn-book:hover{opacity:.9}
.curation-right{display:flex;flex-direction:column;gap:28px}
.curation-info{display:flex;flex-direction:column;gap:10px;padding-bottom:24px;border-bottom:1px solid var(--line);min-height:210px}
.curation-info .tag-title{font-size:14px;color:var(--red);font-weight:700}
.curation-info h3{margin:0;font-size:28px;font-weight:700}
.curation-info .sub-text{font-size:14px;color:#888}
.curation-info .lead-text{font-size:16px;font-weight:600;color:var(--fg);margin:4px 0 0;line-height:1.6}
.curation-info .desc-text{font-size:14px;color:#777;line-height:1.8;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.curation-sub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.curation-sub-card{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .4s var(--ease)}
.curation-sub-card .poster-box{aspect-ratio:108/152;border-radius:8px;transition:transform .4s var(--ease),box-shadow .4s var(--ease),outline .3s var(--ease)}
.curation-sub-card:hover .poster-box{transform:translateY(-4px)}
.curation-sub-card.on .poster-box{outline:3px solid var(--red);outline-offset:2px}
.curation-sub-card .title{font-size:13px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .35s var(--ease)}
.curation-sub-card.on .title{color:var(--red)}

.grid{max-width:1100px;margin:0 auto;padding:56px 24px 100px;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,3vw,40px) clamp(10px,2.5vw,32px);align-items:end}
.grid .ph{aspect-ratio:108/152;transition:transform .4s var(--ease);font-size:14px;border-radius:8px}
.grid .ph:hover{transform:translateY(-6px)}
.grid .ph.big{grid-column:3;grid-row:1;aspect-ratio:164/231;font-size:20px}
.grid .ph:nth-child(1){grid-row:1}
.grid.feat{padding-top:90px}
.h{max-width:1100px;margin:0 auto;padding:64px 24px 0;font-size:22px;font-weight:700}

/* 홈 특별관 소개 (이미지 없는 순수 구조 & 타이포그래피) */
.th{background:#000;color:#fff;min-height:calc(100vh - 58px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;overflow:hidden;position:relative}
.th .stagebox{position:relative;width:100%;height:min(56vh,460px);display:flex;align-items:center;justify-content:center}
.th .screen{position:relative;width:var(--w,50%);height:var(--h,100%);background:radial-gradient(circle at 50% 45%,#1a1b20 0%,#0b0b0d 100%);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,3vw,32px);z-index:2;border:3px solid #000;outline:1px solid #3a3a3a;transition:width .65s var(--ease),height .65s var(--ease)}
.th .screen span{font-weight:700;letter-spacing:.08em}
.wing{position:absolute;top:50%;width:18%;height:90%;background:#0e0e11;outline:1px solid #2e2e2e;opacity:0;transition:opacity .65s var(--ease)}
.wing.l{left:0;clip-path:polygon(0 0,100% 18%,100% 82%,0 100%);transform:translateY(-50%)}
.wing.r{right:0;clip-path:polygon(0 18%,100% 0,100% 100%,0 82%);transform:translateY(-50%)}
.th.sx .wing{opacity:1}
.desc{color:#bbb;font-size:15px;text-align:center;min-height:24px;padding:0 16px}
.more3d{padding:12px 26px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
.more3d:hover{opacity:.9}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px clamp(16px,3.5vw,48px);padding:0 16px 60px}
.tabs button{font-size:clamp(16px,2.2vw,30px);color:#999;padding:6px 4px;border-bottom:2px solid transparent}
.tabs button:hover{color:#ddd}
.tabs button.on{color:#fff;border-color:var(--red)}

/* 특별관 3D 상세 */
.tp{background:#000;color:#fff;min-height:calc(100vh - 58px)}
.tp-in{max-width:1100px;margin:0 auto;padding:72px 24px 20px}
.tp-in h2{margin:0 0 6px;font-size:26px}
.tp-in .desc{text-align:left;padding:0;margin-bottom:20px}
.tp .tabs{padding:28px 16px 32px}
.v3{position:relative;aspect-ratio:16/10;min-height:360px;border-radius:16px;overflow:hidden;background:#030305;border:1px solid #1e1e24}
.v3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.v3err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px}
.tip{position:absolute;pointer-events:none;background:#fff;color:#111;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;display:none;white-space:nowrap;z-index:4;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.inb{position:absolute;right:12px;top:56px;border:2px solid rgba(255,255,255,.85);border-radius:10px;pointer-events:none;display:none;z-index:3;color:#fff;font-size:11px;box-shadow:0 6px 20px rgba(0,0,0,.65);overflow:hidden}
.inb span{position:absolute;left:8px;top:6px;background:rgba(0,0,0,.72);padding:3px 10px;border-radius:999px;font-weight:600}
.vbar{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);padding:8px 14px;border-radius:999px;z-index:3}
.vback{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:10px 20px;border-radius:999px;background:rgba(36,36,36,.92);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:600;z-index:4;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.vback:hover{background:var(--red);border-color:var(--red)}

/* 모달 (부드러운 열림/닫힘 & 알약형 규격 통일) */
.ov{position:fixed;inset:0;background:var(--dim);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s var(--ease),visibility .4s var(--ease)}
.ov.on{opacity:1;visibility:visible;pointer-events:auto}
.modal{background:var(--card);border-radius:24px;width:min(880px,100%);max-height:90vh;overflow:auto;padding:40px;position:relative;transform:translateY(22px) scale(.985);opacity:0;transition:transform .45s var(--ease),opacity .45s var(--ease)}
.ov.on .modal{transform:translateY(0) scale(1);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.x{position:absolute;right:16px;top:12px;font-size:28px;line-height:1;padding:6px 10px}
.top{display:flex;gap:32px}
.top .ph{width:210px;aspect-ratio:210/297;flex:none;border-radius:8px}
.info{display:flex;flex-direction:column;flex:1}
.info h2{margin:0 0 6px;font-size:26px}
.info p{margin:0;color:#888}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:20px}
.body{margin:28px 0 24px;line-height:1.85;max-width:72ch;white-space:pre-line;font-size:15px}
.cast{display:flex;gap:10px;flex-wrap:wrap}
.cast-pill{padding:8px 18px;border-radius:999px;background:var(--gray);color:#fff;font-size:13px;font-weight:500}
.cur-quote{padding:16px 20px;border-left:3px solid var(--red);background:rgba(255,0,1,.06);border-radius:0 12px 12px 0;font-size:15px;font-weight:600;margin:18px 0 0;line-height:1.65}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,32px);background:var(--gray);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:opacity .45s var(--ease),transform .45s var(--ease);z-index:60;pointer-events:none;border:1px solid #444}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 우측 하단 플로팅 원형 장바구니 아이콘 버튼 */
.fab-cart{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--gray);color:#fff;display:flex;align-items:center;justify-content:center;z-index:28;box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}
.fab-cart:hover{background:var(--red);transform:translateY(-3px) scale(1.04)}
.fab-cart svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab-badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.fab-cart:hover .fab-badge{background:#fff;color:var(--red)}

/* 장바구니 & 검색 모달 UI */
.cart-list{display:flex;flex-direction:column;gap:12px;margin:20px 0}
.cart-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.cart-row .c-info{flex:1;min-width:0}
.cart-row .c-info b{display:block;font-size:15px;margin-bottom:2px}
.cart-row .c-info span{font-size:13px;color:#888}
.qty-box{display:flex;align-items:center;gap:8px}
.qty-btn{padding:6px 12px;border-radius:999px;background:var(--gray);color:#fff;font-size:13px;font-weight:700}
.qty-btn:hover{background:var(--red)}
.cart-total-box{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;background:var(--gray);color:#fff;border-radius:16px;margin:20px 0}
.cart-total-box b{font-size:22px;color:#fff}
.search-input{width:100%;padding:12px 20px;border-radius:999px;border:1.5px solid var(--red);background:var(--bg);color:var(--fg);font:inherit;font-size:15px;outline:none;margin:12px 0 20px}
.search-res{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.search-card{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.search-card .ph{aspect-ratio:108/152;border-radius:8px}
.search-card b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-card small{font-size:11px;color:#888}

/* 예매 */
.bk{max-width:1100px;margin:0 auto;padding:76px 24px 100px;display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start}
.bk.one{grid-template-columns:1fr;max-width:560px}
.steps{grid-column:1/-1;display:flex;gap:8px}
.steps div{flex:1;padding:10px 4px;border-bottom:3px solid var(--line);font-size:14px;color:#888;transition:border-color .4s var(--ease),color .4s var(--ease)}
.steps div.on{border-color:var(--red);color:var(--fg);font-weight:700}
.steps div.done{border-color:var(--gray);color:var(--fg)}
.bk h3{margin:28px 0 12px;font-size:16px}
.bk h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--gray);color:#fff;font-size:14px}
.chip:hover{background:#3a3a3a}
.chip.on{background:var(--red)}
.shows{display:grid;gap:8px}
.show{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:12px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;text-align:left}
.show b{font-size:20px}
.show em{font-style:normal;color:#888;font-size:13px}
.show:hover{border-color:var(--gray)}
.show.on{background:var(--gray);color:#fff;border-color:var(--red)}
.show.on em{color:#ccc}
.scr{width:76%;margin:0 auto 24px;padding:8px;text-align:center;font-size:12px;letter-spacing:.3em;background:var(--gray);color:#fff;border-radius:4px 4px 40px 40px/4px 4px 14px 14px}
.row{display:flex;gap:4px;justify-content:center;margin-bottom:5px;align-items:center}
.row i{width:18px;font-style:normal;font-size:11px;color:#888}
.seat{width:clamp(18px,3.8vw,28px);aspect-ratio:1;border-radius:5px 5px 2px 2px;background:var(--gray);color:#fff;font-size:9px;padding:0}
.seat:hover:not(:disabled){background:#555}
.seat.gap{margin-right:14px}
.seat.t{opacity:.15}
.seat.on{background:var(--red)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:20px;font-size:12px;color:#888}
.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;background:var(--gray)}
.legend .a:before{background:var(--red)}
.legend .t:before{opacity:.15}
.sum{position:sticky;top:96px;background:var(--gray);color:#fff;border-radius:16px;padding:24px}
.sum h4{margin:0 0 12px;font-size:20px}
.sum p{margin:6px 0;color:#ccc;font-size:14px}
.tot{font-size:26px;font-weight:700;margin:20px 0 16px;color:#fff}
.cta{width:100%;padding:14px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:16px}
.cta:disabled{background:#555;color:#999}
.tk{border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.tk .hd{background:var(--red);color:#fff;padding:20px 24px}
.tk .hd.store-hd{background:var(--gray)}
.tk .hd small{opacity:.85}
.tk .hd h2{margin:4px 0 0;font-size:22px}
.tk .bd{padding:20px 24px;display:grid;grid-template-columns:90px 1fr;gap:10px 8px;font-size:14px}
.tk .bd span{color:#888}
.tk .bd.sep{border-top:2px dashed var(--line)}
.empty{text-align:center;padding:60px 0;color:#888}

/* 프로필 (로그인 최상단 -> 찜한 영화 -> 화면 테마 설정 최하단) */
.pf-stack{max-width:860px;margin:0 auto;padding:76px 24px 110px;display:flex;flex-direction:column;gap:40px}
.pf-box{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px}
.pf-login-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.pf-field{display:flex;flex-direction:column;gap:10px}
.pf-input{width:100%;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px;outline:none;transition:border-color .35s var(--ease)}
.pf-input:focus{border-color:var(--red)}
.pf-card{background:var(--gray);color:#fff;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:22px}
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pf-user-left{display:flex;align-items:center;gap:12px}
.pf-badge{padding:8px 16px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:13px;flex:none}
.pf-name{font-size:22px;font-weight:700;margin:0 0 4px}
.pf-grade{font-size:13px;color:#bbb}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.pf-stats b{display:block;font-size:20px;margin-bottom:4px}
.pf-stats span{font-size:12px;color:#aaa}
.barcode{background:#fff;color:#111;border-radius:14px;padding:16px;text-align:center}
.barcode .bars{height:40px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px,#111 5px 9px,#fff 9px 11px,#111 11px 12px,#fff 12px 16px);margin-bottom:8px}
.barcode small{font-size:12px;letter-spacing:.2em;font-weight:600;color:#333}
.pf-sec h3{margin:0 0 16px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pf-wish{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pf-wish-item{display:flex;flex-direction:column;gap:8px}
.pf-wish-item .ph{aspect-ratio:108/152;border-radius:8px;cursor:pointer}
.pf-wish-item .w-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-wish-item .w-acts{display:flex;gap:6px}
.pf-wish-item .w-acts button{flex:1;padding:8px 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.pf-wish-item .w-acts button.go{background:var(--red);color:#fff;border:none}

@media(max-width:850px){.curation-body,.pf-login-grid{grid-template-columns:1fr}.curation-sub-grid,.pf-wish,.search-res{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.bk{grid-template-columns:1fr}.sum{position:static}}
@media(max-width:700px){header{padding:0 12px}nav button{padding:5px 7px;font-size:12px}.logo-img{height:24px}.btn-back{left:12px}.top{flex-direction:column}.top .ph{width:60%}.modal{padding:24px}.stage .ph[data-pos="-2"],.stage .ph[data-pos="2"]{opacity:0}.stage-track{--s1:130px}.seat.gap{margin-right:8px}.show{grid-template-columns:64px 1fr auto}.fab-cart{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}}
</style>

<script>
const movies=[
{id:0,t:"룩백",poster:"img/lookback.jpg",sub:"애니메이션 · 58분",
 d:"학교 신문에서 네컷 만화를 그리는 자신만만한 소녀 '후지노'와 방 안에 틀어박힌 외톨이 '쿄모토'. 만화가 세상의 전부였던 시절, 두 소녀의 눈부신 사계절이 채워지기 시작한다.",

 curText:"후지모토 타츠키 원작의 단편이 스크린의 호흡을 얻어 더욱 짙은 여운을 남깁니다. 방 안의 쿄모토와 책상 앞의 후지노, 서로 다른 고독을 품은 두 소녀가 네 컷 만화라는 작은 프레임을 매개로 세상과 연결되는 과정은 창작이라는 행위의 본질을 가장 순수하게 비춥니다.\n\n빗속을 내달리는 후지노의 뒷모습과 스케치북 위로 번지는 연필의 사각거림은 오직 어두운 상영관의 밀도 높은 사운드와 대형 화면에서만 온전히 체감할 수 있는 영화적 순간입니다. 무언가를 끝까지 그려내고 써 내려간 경험이 있는 모든 관객에게 깊은 울림을 건네는 작품입니다."},
{id:1,t:"최종면접",poster:"img/Final Interview.jpg",sub:"스릴러 · 104분",

 curText:"단 하나의 닫힌 공간, 다섯 명의 지원자, 그리고 보이지 않는 면접관. 화려한 액션이나 외부 사건 없이 오직 한정된 공간의 차가운 미장센과 인물들의 미세한 시선 흔들림만으로 극한의 긴장감을 구축한 밀실 심리 스릴러입니다.\n\n면접이 진행될수록 합격을 향한 열망은 생존 본능으로 변질되고, 완벽해 보였던 이력서 뒤편의 균열이 하나씩 드러납니다. 현대 경쟁 사회가 개인에게 요구하는 가면과 윤리적 딜레마를 날카로운 대사와 정교한 편집 리듬으로 해부한 각본의 힘이 압도적입니다."},
{id:2,t:"오디세이",poster:"img/The Odyssey.jpg",sub:"SF · 135분",
 d:"미지의 위성으로 떠나는 사상 최대의 우주 탐사 프로젝트. 신비로운 항로 끝에 기다리고 있는 인류의 원초적 기원과 절망.",
 curTag:"#필름소사이어티 · 사변적 SF",

 d:"땅속 깊은 곳에 숨겨진 보물을 파헤치는 미스터리 탐사원들. 그들이 발굴한 것은 상상을 초월하는 위험한 유물이었다.",

 d:"작고 귀여운 치이카와와 친구들의 파란만장한 일상 대모험! 귀여움 뒤에 숨겨진 험난한 노동과 감동의 순간들.",

 curText:"사랑스러운 작화 이면에 녹록지 않은 현실의 무게와 노동, 그럼에도 포기하지 않는 연대의 가치를 담아낸 극장판 애니메이션입니다. 작은 존재들이 거대한 세계에 맞서 하루를 살아내는 모습이 묘한 페이소스를 자아냅니다.\n\n웃음 뒤에 찾아오는 뭉클한 여운과 친구를 향한 조건 없는 다정함이 세대를 불문하고 따뜻한 공감을 이끌어냅니다."},
{id:6,t:"집착",poster:"img/Obsession.jpg",sub:"미스터리 · 110분",
 d:"벗어날 수 없는 굴레와 빗나간 집착. 어둠 속에서 서서히 다가오는 기괴한 그림자의 정체는 무엇인가.",

{id:7,t:"인턴",poster:"img/Intern.jpg",sub:"드라마 · 121분",
 d:"창업 1년 만에 성공을 거둔 패션 스타트업에 70세 시니어 인턴이 출근하면서 일어나는 가슴 따뜻한 성장 드라마.",

function initStage(){

function updateStage(){
  const bg=$("#stageBg");
  if(bg&&movies[cur])bg.style.backgroundImage=`url("${movies[cur].poster}")`;
  document.querySelectorAll("#stageTrack .ph").forEach(c=>{
    const i=+c.dataset.id;let d=i-cur,h=Math.floor(movies.length/2);

    c.dataset.pos=d;c.onclick=()=>d===0?openM(movies[i],"영화"):(cur=i,updateStage(),startStageAuto());
  });

function selectCurationIdx(idx,isManual=false){
  if(idx===curationIdx)return;

  document.querySelectorAll("#curSubGrid .curation-sub-card").forEach((c,i)=>c.classList.toggle("on",i===curationIdx));

    const f=CURATED_LIST[curationIdx];

    if(pb)pb.innerHTML=`<div class="badge-tag">CGV SPECIAL</div>${posterHtml(f.poster,f.t)}`;

    $("#curLead").textContent=f.curHead;
    $("#curDesc").textContent=f.curText;

  const key=`${label}:${m.t}`;

  if(idx>=0){WISH.splice(idx,1);toast("찜을 취소했어요")}
  else{WISH.unshift({key,label,id:m.id??null,t:m.t,poster:m.poster,sub:m.sub});toast(label==="영화"?"프로필 '찜한 영화'에 추가했어요":"찜 목록에 추가했어요")}

  return idx<0;
}

  const cnt=CART.reduce((a,b)=>a+b.qty,0);

function addToCart(item){
  const found=CART.find(c=>c.t===item.t);

function changeCartQty(idx,delta){
  if(!CART[idx])return;

  openCart();
}

  const bodyHtml=CART.length
    ?`<div class="cart-list">${CART.map((c,i)=>`<div class="cart-row">

function checkoutCart(){
  if(!CART.length)return;
  const total=CART.reduce((a,b)=>a+b.price*b.qty,0);
  const summary=CART.map(c=>`${c.t} × ${c.qty}`).join(", ");
  const pickupNo="P-"+String(Math.floor(100+Math.random()*900));
  const order={
    type:"store",
    no:"SNK"+String(Date.now()).slice(-7),
    pickupNo,
    title:CART[0].t+(CART.length>1?` 외 ${CART.length-1}건`:""),
    itemsText:summary,
    branch:PICKUP_OPT.branch,
    when:PICKUP_OPT.when,
    total,
    pay:PICKUP_OPT.pay,
    pickedUp:false
  };
  MY.unshift(order);

  showPickupTicketModal(order);
}

  <h2 style="margin:0 0 6px;font-size:24px">매점 픽업 교환권 발급 완료</h2>
  <p style="margin:0 0 20px;color:#888;font-size:14px">매점 픽업대에서 아래 픽업 번호를 제시해 주세요.</p>
  <div class="tk">
    <div class="hd store-hd"><small>${order.branch} · ${order.when}</small><h2>픽업 번호 ${order.pickupNo}</h2></div>
    <div class="bd"><span>주문메뉴</span><b>${order.itemsText}</b><span>결제금액</span><b>${won(order.total)}</b><span>결제수단</span><b>${order.pay}</b></div>
    <div class="bd sep"><span>주문번호</span><b>${order.no}</b><span>수령상태</span><b style="color:var(--red)">${order.pickedUp?"픽업 완료":"조리 및 픽업 대기"}</b></div>
  </div>
  <div class="ctl" style="padding:16px 0 0">
    <button onclick="completePickup('${order.no}')">${order.pickedUp?"픽업 완료됨":"픽업 완료 확인"}</button>
    <button class="red" onclick="closeM();go('my')">내 예매/예약에서 보기</button>
  </div>`;
  $("#ov").classList.add("on");
}
function completePickup(no){
  const target=MY.find(x=>x.no===no);
  if(target){
    target.pickedUp=true;
    try{localStorage.setItem("cgvMy",JSON.stringify(MY))}catch(e){}
    toast("매점 메뉴 픽업이 완료되었어요!");
    if(page()==="my")renderMy();
    if($("#ov").classList.contains("on"))showPickupTicketModal(target);
  }
}

/* 통합 검색 모달 */
function openSearch(){
  $("#md").innerHTML=`<button class="x" aria-label="닫기" onclick="closeM()">×</button>
  <h2 style="margin:0 0 4px;font-size:22px">통합 검색</h2>
  <p style="margin:0;color:#888;font-size:13px">상영 중인 영화와 매점 메뉴를 빠르게 검색하세요.</p>
  <input class="search-input" id="searchInp" type="search" placeholder="영화 제목 또는 매점 메뉴 입력..." oninput="renderSearchRes(this.value)">
  <div class="search-res" id="searchRes"></div>`;
  $("#ov").classList.add("on");
  renderSearchRes("");
  setTimeout(()=>$("#searchInp")?.focus(),60);
}
function renderSearchRes(q){
  const box=$("#searchRes");if(!box)return;
  const kw=q.trim().toLowerCase();
  const mHits=movies.filter(m=>m.t.toLowerCase().includes(kw)||m.sub.toLowerCase().includes(kw)).map(m=>({...m,kind:"영화"}));
  const sHits=items.filter(s=>s.t.toLowerCase().includes(kw)||s.d.toLowerCase().includes(kw)).map(s=>({...s,kind:"매점"}));
  const all=[...mHits,...sHits].slice(0,8);
  if(!all.length){box.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:32px 0;color:#888">검색 결과가 없어요.</div>`;return}
  box.innerHTML=all.map(x=>`<button class="search-card" onclick="openSearched('${x.kind}','${x.t.replace(/'/g,"\\'")}')">
    <div class="ph">${posterHtml(x.poster,x.t)}</div>
    <b>${x.t}</b><small>${x.kind} · ${x.sub}</small>
  </button>`).join("");
}
function openSearched(kind,title){
  const target=kind==="영화"?movies.find(m=>m.t===title):items.find(s=>s.t===title);
  if(target)openM(target,kind);
}

/* 모달 (영화 / 매점 상세 — 알약형 규격 통일) */
function openM(m,label){
  const isM=label==="영화";
  const acts=isM?["예매","찜","공유","예고편"]:["담기","장바구니","찜","공유"];
  const wished=WISH.some(w=>w.key===`${label}:${m.t}`);
  $("#md").innerHTML=`<button class="x" aria-label="닫기" onclick="closeM()">×</button>
  <div class="top"><div class="ph">${posterHtml(m.poster,m.t)}</div><div class="info"><h2>${m.t}</h2><p>${m.sub}</p>
  <div class="acts">${acts.map(a=>`<button class="pill-btn${a==="예매"||a==="담기"?" go":""}${a==="찜"&&wished?" on":""}" data-a="${a}">${a}</button>`).join("")}</div></div></div>
  <p class="body">${m.d}</p>
  <div class="cast">${(isM?cast:["기본","라지","치즈","세트"]).map(c=>`<span class="cast-pill">${c}</span>`).join("")}</div>`;
  $("#md").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==="예매")startBooking(m.id);
    else if(a==="찜"){const on=toggleWish(m,label);b.classList.toggle("on",on)}
    else if(a==="담기")addToCart(m);
    else if(a==="장바구니")openCart();
    else if(a==="공유")toast("링크를 복사했어요");
    else toast("예고편을 불러오는 중이에요");
  });
  $("#ov").classList.add("on");$("#md .x").focus();
}
function closeM(){$("#ov").classList.remove("on")}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeM()};

/* ---------- 가상 예매 (10열 × 16석) ---------- */
const B={step:1,movie:2,day:0,show:null,seats:[],pay:"신용/체크카드"};
let MY=[];try{MY=JSON.parse(localStorage.getItem("cgvMy")||"[]")}catch(e){}
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return{l:`${d.getMonth()+1}/${d.getDate()}`,w:"일월화수목금토"[d.getDay()]}});
const TIMES=["10:20","13:05","16:10","19:30","22:10"];
const SURCH={laser:2000,IMAX:4000,SCREENX:3000,"4DX":5000,"Dolby Atmos":3000};
const ROWS="ABCDEFGHIJ",NROW=10,COLS=16;
const won=n=>n.toLocaleString()+"원";
const shows=()=>TIMES.map((t,n)=>({t,n,hall:TABS[(n+B.day)%5]}));
const isTaken=(s,r,c)=>((r+1)*7+(c+1)*13+B.day*3+s.n*5+B.movie)%6===0;
const left=s=>{let k=0;for(let r=0;r<NROW;r++)for(let c=0;c<COLS;c++)if(!isTaken(s,r,c))k++;return k};
function startBooking(i){
  Object.assign(B,{step:1,movie:i,day:0,show:null,seats:[]});closeM();
  if(page()==="booking")renderBooking();else go("booking");
}
function pick(k,v){
  if(k==="movie"){B.movie=v;B.show=null;B.seats=[]}
  if(k==="day"){B.day=v;B.show=null;B.seats=[]}
  if(k==="show"){B.show=shows()[v];B.seats=[]}
  if(k==="pay")B.pay=v;
  renderBooking();
}
function seat(id){
  const i=B.seats.indexOf(id);
  if(i>=0)B.seats.splice(i,1);else if(B.seats.length>=4)return toast("최대 4석까지 선택할 수 있어요");else B.seats.push(id);
  renderBooking();
}
function next(){
  if(B.step<3){B.step++;renderBooking();scrollTo({top:0,behavior:"smooth"});return}
  const m=movies[B.movie],price=14000+SURCH[B.show.hall];
  B.done={type:"movie",no:"CGV"+String(Date.now()).slice(-8),movie:m.t,date:`${days[B.day].l} (${days[B.day].w})`,time:B.show.t,hall:B.show.hall,seats:[...B.seats].sort(),total:price*B.seats.length,pay:B.pay};
  MY.unshift(B.done);try{localStorage.setItem("cgvMy",JSON.stringify(MY))}catch(e){}
  B.step=4;renderBooking();scrollTo({top:0,behavior:"smooth"});
}
const ticket=t=>{
  if(t.type==="store"){
    return `<div class="tk"><div class="hd store-hd"><small>${t.branch} · ${t.when}</small><h2>[매점 픽업] ${t.title} · ${t.pickupNo}</h2></div>
    <div class="bd"><span>주문메뉴</span><b>${t.itemsText}</b><span>결제금액</span><b>${won(t.total)}</b><span>수령상태</span><b style="color:${t.pickedUp?"#888":"var(--red)"}">${t.pickedUp?"픽업 완료":"픽업 대기중"}</b></div>
    <div class="bd sep"><span>주문번호</span><b>${t.no}</b><span>픽업확인</span><b>${t.pickedUp?"수령 완료":`<button class="pill-btn go" style="padding:5px 14px;font-size:12px" onclick="completePickup('${t.no}')">픽업 완료하기</button>`}</b></div></div>`;
  }
  return `<div class="tk"><div class="hd"><small>${t.date} ${t.time}</small><h2>${t.movie}</h2></div>
  <div class="bd"><span>상영관</span><b>${t.hall}관</b><span>좌석</span><b>${t.seats.join(", ")}</b><span>결제금액</span><b>${won(t.total)}</b></div>
  <div class="bd sep"><span>예매번호</span><b>${t.no}</b><span>결제수단</span><b>${t.pay}</b></div></div>`;
};
function renderBooking(){
  const el=$("#bk"),m=movies[B.movie],s=B.show,price=s?14000+SURCH[s.hall]:0,total=price*B.seats.length;
  const steps=["영화·시간","좌석","결제","완료"].map((x,i)=>`<div class="${B.step===i+1?"on":i+1<B.step?"done":""}">${i+1}. ${x}</div>`).join("");
  el.classList.toggle("one",B.step===4);
  if(B.step===4){
    el.innerHTML=`<div class="steps">${steps}</div><div><h2 style="margin:0 0 6px">예매가 완료됐어요</h2><p style="color:#888;margin:0 0 20px">가상 예매입니다. 실제 결제는 이루어지지 않아요.</p>${ticket(B.done)}
    <div class="ctl" style="padding:20px 0 0"><button onclick="go('my')">내 예매 보기</button><button class="red" onclick="go('home')">홈으로</button></div></div>`;return;
  }
  let main="";
  if(B.step===1){
    main=`<h3>영화</h3><div class="chips">${movies.map((x,i)=>`<button class="chip${i===B.movie?" on":""}" onclick="pick('movie',${i})">${x.t}</button>`).join("")}</div>
    <h3>날짜</h3><div class="chips">${days.map((x,i)=>`<button class="chip${i===B.day?" on":""}" onclick="pick('day',${i})">${x.l} (${x.w})</button>`).join("")}</div>
    <h3>상영 시간</h3><div class="shows">${shows().map(x=>`<button class="show${s&&s.n===x.n?" on":""}" onclick="pick('show',${x.n})"><b>${x.t}</b><span>${x.hall}관</span><em>잔여 ${left(x)}석</em></button>`).join("")}</div>`;
  }else if(B.step===2){
    let rows="";
    for(let r=0;r<NROW;r++){rows+=`<div class="row"><i>${ROWS[r]}</i>`;
      for(let c=0;c<COLS;c++){const id=ROWS[r]+(c+1),t=isTaken(s,r,c);
        rows+=`<button class="seat${t?" t":""}${B.seats.includes(id)?" on":""}${c===3||c===11?" gap":""}" ${t?"disabled":""} aria-label="${id}" onclick="seat('${id}')">${c+1}</button>`}
      rows+="</div>"}
    main=`<h3>좌석 선택 <small style="color:#888;font-weight:400">(최대 4석 · 160석 규모)</small></h3><div class="scr">SCREEN</div>${rows}<div class="legend"><span>선택 가능</span><span class="a">선택됨</span><span class="t">예매 완료</span></div>`;
  }else{
    main=`<h3>결제 수단</h3><div class="chips">${["신용/체크카드","카카오페이","네이버페이","휴대폰 결제"].map(x=>`<button class="chip${B.pay===x?" on":""}" onclick="pick('pay','${x}')">${x}</button>`).join("")}</div>
    <h3>결제 내역</h3><div class="tk"><div class="bd"><span>일반 요금</span><b>${won(14000)} × ${B.seats.length}</b><span>${s.hall}관 추가</span><b>${won(SURCH[s.hall])} × ${B.seats.length}</b><span>총 결제금액</span><b style="color:var(--red)">${won(total)}</b></div></div>`;
  }
  const ok=B.step===1?!!s:B.seats.length>0;
  el.innerHTML=`<div class="steps">${steps}</div><div>${main}</div>
  <aside class="sum"><h4>${m.t}</h4><p>${days[B.day].l} (${days[B.day].w}) ${s?s.t+" · "+s.hall+"관":"시간을 선택해 주세요"}</p><p>좌석 ${B.seats.length?[...B.seats].sort().join(", "):"-"}</p>
  <div class="tot">${won(total)}</div><button class="cta" ${ok?"":"disabled"} onclick="next()">${B.step===3?won(total)+" 결제하기":["좌석 선택하기","결제 단계로"][B.step-1]}</button></aside>`;
}
function renderMy(){
  $("#myList").innerHTML=`<div class="steps"><div class="on">내 예매/예약 · 매점 픽업</div></div><div>${MY.length?MY.map(ticket).join(""):`<div class="empty">아직 예매 및 매점 주문 내역이 없어요.<div class="ctl" style="padding:20px 0 0"><button class="red" onclick="startBooking(cur)">예매하러 가기</button></div></div>`}</div>`;
}

/* ---------- 특별관 3D 체험 (이미지 없는 스크린 & 어두운 상영관 조도) ---------- */
const T={mode:"over",hov:null,last:null,sel:null,yaw:0,pitch:0};
const SX=c=>(c-7.5)*.64+(c<4?-.5:c>11?.5:0);
const SZ=r=>5.0+r*1.2;
const SY=r=>r*.42;
const SEYE=(r,c)=>new THREE.Vector3(SX(c),SY(r)+1.35,SZ(r)-.05);
const sid=i=>ROWS[Math.floor(i/COLS)]+(i%COLS+1);

function viewOver(){
  T.mode="over";T.yaw=T.pitch=0;
  ui();
}

function makeMoldedBox(w,h,d,r=.04){
  const s=new THREE.Shape(),hw=w/2-r,hh=h/2-r;
  s.moveTo(-hw,-hh-r);s.lineTo(hw,-hh-r);s.quadraticCurveTo(hw+r,-hh-r,hw+r,-hh);
  s.lineTo(hw+r,hh);s.quadraticCurveTo(hw+r,hh+r,hw,hh+r);
  s.lineTo(-hw,hh+r);s.quadraticCurveTo(-hw-r,hh+r,-hw-r,hh);
  s.lineTo(-hw-r,-hh);s.quadraticCurveTo(-hw-r,-hh-r,-hw,-hh-r);
  const g=new THREE.ExtrudeGeometry(s,{depth:d-r*2,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:r,bevelThickness:r});
  g.center();return g;
}

function buildSeats(k){
  if(T.seatGroup)T.sc.remove(T.seatGroup);
  const sg=new THREE.Group(),is4DX=k==="4DX",n=NROW*COLS;
  const dm=new THREE.Object3D();
  const fabricMat=new THREE.MeshStandardMaterial({roughness:.82,metalness:.05});
  const trimMat=new THREE.MeshStandardMaterial({color:0x111216,roughness:.5,metalness:.3});
  const metalMat=new THREE.MeshStandardMaterial({color:0x22252b,roughness:.35,metalness:.7});

  const mk=(g,m)=>new THREE.InstancedMesh(g,m,n);
  T.cush=mk(makeMoldedBox(is4DX?.52:.48,.14,.48,.035),fabricMat);
  T.back=mk(makeMoldedBox(is4DX?.54:.48,.64,.11,.04),fabricMat);
  T.head=mk(makeMoldedBox(is4DX?.40:.32,.18,.13,.04),fabricMat);
  T.armL=mk(makeMoldedBox(.075,.07,.44,.02),trimMat);
  T.armR=mk(makeMoldedBox(.075,.07,.44,.02),trimMat);
  T.leg=mk(new THREE.BoxGeometry(.09,.38,.12),metalMat);

  if(is4DX){
    T.bolL=mk(makeMoldedBox(.08,.56,.18,.025),trimMat);
    T.bolR=mk(makeMoldedBox(.08,.56,.18,.025),trimMat);
    T.foot=mk(new THREE.BoxGeometry(.42,.04,.16),metalMat);
    const podGeo=new THREE.BoxGeometry(2.52,.18,.82);
    const podMat=new THREE.MeshStandardMaterial({color:0x0e0f12,roughness:.55,metalness:.45});
    const pods=new THREE.InstancedMesh(podGeo,podMat,NROW*4);
    let pi=0;
    for(let r=0;r<NROW;r++){
      for(let p=0;p<4;p++){
        const cx=(SX(p*4)+SX(p*4+3))/2;
        dm.position.set(cx,SY(r)+.25,SZ(r)+.02);dm.rotation.set(0,0,0);dm.updateMatrix();
        pods.setMatrixAt(pi++,dm.matrix);
      }
    }
    sg.add(pods,T.bolL,T.bolR,T.foot);
  }else{
    T.bolL=T.bolR=T.foot=null;
  }

  for(let r=0;r<NROW;r++){
    const by=SY(r)+(is4DX?.34:.22);
    for(let c=0;c<COLS;c++){
      const i=r*COLS+c,x=SX(c),z=SZ(r);
      dm.rotation.set(0,0,0);
      dm.position.set(x,by+.24,z-.02);dm.updateMatrix();T.cush.setMatrixAt(i,dm.matrix);
      dm.rotation.set(.15,0,0);
      dm.position.set(x,by+.56,z+.21);dm.updateMatrix();T.back.setMatrixAt(i,dm.matrix);
      dm.position.set(x,by+.91,z+.26);dm.updateMatrix();T.head.setMatrixAt(i,dm.matrix);
      dm.rotation.set(0,0,0);
      dm.position.set(x-.26,by+.42,z);dm.updateMatrix();T.armL.setMatrixAt(i,dm.matrix);
      dm.position.set(x+.26,by+.42,z);dm.updateMatrix();T.armR.setMatrixAt(i,dm.matrix);
      dm.position.set(x,by+.06,z+.06);dm.updateMatrix();T.leg.setMatrixAt(i,dm.matrix);

      if(is4DX){
        dm.rotation.set(.15,.22,0);
        dm.position.set(x-.25,by+.58,z+.16);dm.updateMatrix();T.bolL.setMatrixAt(i,dm.matrix);
        dm.rotation.set(.15,-.22,0);
        dm.position.set(x+.25,by+.58,z+.16);dm.updateMatrix();T.bolR.setMatrixAt(i,dm.matrix);
        dm.rotation.set(-.25,0,0);
        dm.position.set(x,by+.12,z-.34);dm.updateMatrix();T.foot.setMatrixAt(i,dm.matrix);
      }
    }
  }
  sg.add(T.cush,T.back,T.head,T.armL,T.armR,T.leg);
  T.seatGroup=sg;
  T.sc.add(sg);
}

function init3D(){
  const r=new THREE.WebGLRenderer({antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const sc=new THREE.Scene();
  sc.background=new THREE.Color(0x020204);
  sc.fog=new THREE.FogExp2(0x020204,.024);
  T.r=r;T.sc=sc;
  T.cam=new THREE.PerspectiveCamera(54,1.6,.1,70);
  T.icam=new THREE.PerspectiveCamera(64,16/9,.1,70);
  T.OVP=new THREE.Vector3(0,9.2,18.2);
  T.OVL=new THREE.Vector3(0,3.2,2.5);
  T.cp=T.OVP.clone();T.ct=T.OVL.clone();
  T.col=new THREE.Color();T.ray=new THREE.Raycaster();T.m=new THREE.Vector2();

  sc.add(new THREE.AmbientLight(0x94a3b8,.16));
  const scrLight=new THREE.PointLight(0x60a5fa,.68,32);scrLight.position.set(0,5.0,1.8);sc.add(scrLight);
  const ceilLight=new THREE.PointLight(0xffffff,.16,38);ceilLight.position.set(0,10.5,11);sc.add(ceilLight);

  const room=new THREE.Mesh(new THREE.BoxGeometry(23,11.5,21),new THREE.MeshStandardMaterial({color:0x07080b,side:THREE.BackSide,roughness:.95}));
  room.position.set(0,5.75,9.5);sc.add(room);
  const stageFloor=new THREE.Mesh(new THREE.BoxGeometry(22.5,.3,5.5),new THREE.MeshStandardMaterial({color:0x090a0d,roughness:.4,metalness:.2}));
  stageFloor.position.set(0,.15,2.2);sc.add(stageFloor);

  const stepMat=new THREE.MeshStandardMaterial({color:0x0d0e12,roughness:.9});
  const ledMat=new THREE.MeshBasicMaterial({color:0xd95b16});
  for(let i=0;i<NROW;i++){
    const h=SY(i)+.24,z=SZ(i);
    const st=new THREE.Mesh(new THREE.BoxGeometry(21.5,h,1.2),stepMat);
    st.position.set(0,h/2,z);sc.add(st);
    [-2.75,2.75].forEach(ax=>{
      const led=new THREE.Mesh(new THREE.BoxGeometry(.26,.022,.04),ledMat);
      led.position.set(ax,h+.01,z-.59);sc.add(led);
    });
  }

  const bafMat=new THREE.MeshStandardMaterial({color:0x0a0b0e,roughness:.95});
  for(let z=3;z<=16;z+=2.6){
    const baf=new THREE.Mesh(new THREE.BoxGeometry(20,.35,.22),bafMat);
    baf.position.set(0,11.1,z);sc.add(baf);
  }
  const booth=new THREE.Mesh(new THREE.PlaneGeometry(2.2,.8),new THREE.MeshBasicMaterial({color:0x93c5fd}));
  booth.position.set(0,8.6,19.9);booth.rotation.y=Math.PI;sc.add(booth);
  const beam=new THREE.Mesh(new THREE.ConeGeometry(4.5,19.5,24,1,true),new THREE.MeshBasicMaterial({color:0x93c5fd,transparent:true,opacity:.026,side:THREE.DoubleSide,depthWrite:false}));
  beam.position.set(0,6.4,10.2);beam.rotation.x=-Math.PI/2-.22;sc.add(beam);

  const cv=r.domElement;let dn=null;
  const hit=e=>{
    const b=cv.getBoundingClientRect();
    T.m.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);
    T.ray.setFromCamera(T.m,T.cam);
    const targets=[T.cush,T.back,T.head].filter(Boolean);
    const h=T.ray.intersectObjects(targets)[0];
    return h?h.instanceId:null;
  };
  cv.addEventListener("pointerdown",e=>{dn={x:e.clientX,y:e.clientY,mv:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",e=>{
    if(T.mode==="seat"){
      if(dn){const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>3)dn.mv=true;
        T.yaw=Math.max(-.95,Math.min(.95,T.yaw-dx*.004));T.pitch=Math.max(-.5,Math.min(.55,T.pitch+dy*.004));dn.x=e.clientX;dn.y=e.clientY}
      return;
    }
    const i=hit(e),tip=$("#tip");
    if(i!==T.hov){T.hov=i;paint()}
    if(i==null)tip.style.display="none";
    else{const b=cv.getBoundingClientRect();tip.style.display="block";tip.style.left=(e.clientX-b.left+14)+"px";tip.style.top=(e.clientY-b.top+14)+"px";tip.textContent=sid(i)+" · 클릭하면 이 자리에서 보기"}
    cv.style.cursor=i!=null?"pointer":"default";
  });
  cv.addEventListener("pointerup",e=>{
    const d=dn;dn=null;if(T.mode==="seat"||(d&&d.mv))return;
    const i=hit(e);if(i==null)return;
    T.mode="seat";T.sel=[Math.floor(i/COLS),i%COLS];T.last=i;T.yaw=T.pitch=0;
    $("#tip").style.display="none";paint();ui();
  });
  cv.addEventListener("pointerleave",()=>{if(T.hov!=null){T.hov=null;paint()}$("#tip").style.display="none"});
  addEventListener("resize",()=>{if(page()==="theater")resize()});
  T.ok=true;loop();
}

function screenTex(k){
  const cv=document.createElement("canvas");cv.width=1024;cv.height=512;const g=cv.getContext("2d");
  const gr=g.createRadialGradient(512,256,40,512,256,560);
  gr.addColorStop(0,"#1c2230");
  gr.addColorStop(1,"#090b10");
  g.fillStyle=gr;g.fillRect(0,0,1024,512);
  g.strokeStyle="rgba(255,255,255,.28)";g.lineWidth=3;g.strokeRect(16,16,992,480);
  g.fillStyle="#f8fafc";g.textAlign="center";g.font="700 84px sans-serif";
  g.fillText(k,512,282);
  const tx=new THREE.CanvasTexture(cv);
  tx.needsUpdate=true;
  return tx;
}

function buildHall(k){
  if(T.hall)T.sc.remove(T.hall);
  const g=new THREE.Group(),big=k==="IMAX",W=big?16.8:13.4,H=big?7.8:5.8,cy=big?4.9:3.8,tx=screenTex(k);
  const accent=fmts[k][3];

  const frame=new THREE.Mesh(new THREE.BoxGeometry(W+.45,H+.45,.25),new THREE.MeshStandardMaterial({color:0x040406,roughness:.8}));
  frame.position.set(0,cy,-.35);g.add(frame);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshBasicMaterial({map:tx}));
  scr.position.set(0,cy,-.2);g.add(scr);

  const panelMat=new THREE.MeshStandardMaterial({color:0x0b0c10,roughness:.9});
  const stripMat=new THREE.MeshBasicMaterial({color:accent});
  [-1,1].forEach(side=>{
    for(let z=3.5;z<=16.5;z+=2.6){
      const pan=new THREE.Mesh(new THREE.BoxGeometry(.28,8.5,1.6),panelMat);
      pan.position.set(side*11.2,5.2,z);g.add(pan);
      const led=new THREE.Mesh(new THREE.BoxGeometry(.04,7.4,.06),stripMat);
      led.position.set(side*11.02,5.2,z+.82);g.add(led);
    }
  });

  if(k==="SCREENX")[-1,1].forEach(d=>{
    const w=new THREE.Mesh(new THREE.PlaneGeometry(6.2,H*.88),new THREE.MeshBasicMaterial({map:tx,color:0x94a3b8,side:THREE.DoubleSide}));
    w.position.set(d*(W/2+2.6),cy,2.1);w.rotation.y=-d*.52;g.add(w);
  });
  if(k==="Dolby Atmos")for(let i=0;i<18;i++){
    const sp=new THREE.Mesh(new THREE.BoxGeometry(.38,.22,.38),new THREE.MeshStandardMaterial({color:0x14151a,emissive:0xf59e0b,emissiveIntensity:.25}));
    sp.position.set((i%2?-1:1)*6.2,10.7,2.0+Math.floor(i/2)*1.8);g.add(sp);
  }
  T.hall=g;T.sc.add(g);T.ty=cy;
}

function paint(){
  if(!T.cush)return;
  const si=T.sel?T.sel[0]*COLS+T.sel[1]:-1;
  const baseHex=fmt==="4DX"?0x2b1e22:0x23262e;
  for(let i=0;i<NROW*COLS;i++){
    T.col.setHex(i===si?0xFF0001:T.hov===i?0xff7a7a:baseHex);
    T.cush.setColorAt(i,T.col);
    T.back.setColorAt(i,T.col);
    T.head.setColorAt(i,T.col);
  }
  T.cush.instanceColor.needsUpdate=T.back.instanceColor.needsUpdate=T.head.instanceColor.needsUpdate=true;
}

function resize(){
  const h=$("#v3");if(!T.r||!h)return;
  T.w=h.clientWidth;T.h=h.clientHeight;
  T.r.setSize(T.w,T.h,false);
  T.cam.aspect=T.w/T.h;T.cam.updateProjectionMatrix();
  T.iw=Math.round(Math.min(240,T.w*.32));T.ih=Math.round(T.iw*9/16);
  const b=$("#inb");b.style.width=T.iw+"px";b.style.height=T.ih+"px";
}

function ui(){
  const v=$("#vbar"),vb=$("#vback");if(!v||!T.r)return;
  const isSeat=T.mode==="seat"&&T.sel;
  T.r.domElement.style.touchAction=isSeat?"none":"pan-y";
  if(vb)vb.classList.toggle("hidden",!isSeat);
  v.innerHTML=isSeat
    ?`<span>내 시야 · ${ROWS[T.sel[0]]}${T.sel[1]+1} · 드래그로 둘러보기</span><button class="pill-btn go" style="padding:5px 14px;font-size:12px" onclick="viewOver()">전체 보기</button>`
    :`<span>좌석에 마우스를 올리면 상단에서 시야를 미리보고, 클릭하면 그 자리로 이동해요</span>`;
}

function open3D(){
  if(T.ok===false)return;
  const host=$("#v3");
  if(!T.r){try{init3D();host.prepend(T.r.domElement)}catch(e){T.ok=false;T.r=null;host.innerHTML='<div class="v3err">이 기기에서는 3D를 불러올 수 없어요</div>';return}}
  T.mode="over";T.sel=null;T.last=null;T.hov=null;T.yaw=T.pitch=0;T.cp.copy(T.OVP);T.ct.copy(T.OVL);T.ik=null;
  buildHall(fmt);buildSeats(fmt);paint();ui();resize();
}

function loop(){
  requestAnimationFrame(loop);
  const r=T.r;if(!r||page()!=="theater"||!T.w)return;
  const seatM=T.mode==="seat"&&T.sel,ty=T.ty||3.8;
  const tp=seatM?SEYE(T.sel[0],T.sel[1]):T.OVP;
  const tl=seatM?new THREE.Vector3(T.yaw*11,ty+T.pitch*6,-.2):T.OVL;
  T.cp.lerp(tp,.045);T.ct.lerp(tl,.065);
  T.cam.position.copy(T.cp);T.cam.lookAt(T.ct);
  T.cam.fov+=((seatM?74:54)-T.cam.fov)*.05;
  T.cam.updateProjectionMatrix();
  r.setScissorTest(false);r.setViewport(0,0,T.w,T.h);r.render(T.sc,T.cam);

  const f=seatM?null:(T.hov!=null?T.hov:T.last),b=$("#inb");
  if(f!=null){
    const sy=T.h-T.ih-56;
    T.icam.position.copy(SEYE(Math.floor(f/COLS),f%COLS));
    T.icam.lookAt(0,ty,-.2);
    r.setScissorTest(true);
    r.setScissor(T.w-T.iw-12,sy,T.iw,T.ih);
    r.setViewport(T.w-T.iw-12,sy,T.iw,T.ih);
    r.render(T.sc,T.icam);
    r.setScissorTest(false);
  }
  const key=String(f);
  if(T.ik!==key){T.ik=key;b.style.display=f==null?"none":"block";if(f!=null)b.innerHTML=`<span>내 시야 · ${sid(f)}</span>`}
}

/* 초기화 */
initStage();initCuration();drawGrid($("#mg"),movies,"영화");drawGrid($("#sg"),items,"매점");mountHome();showT(fmt);updateCartBtn();route();
</script>
