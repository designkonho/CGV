<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CGV 리디자인</title>
<style>
:root{--bg:#fff;--fg:#111;--gray:#242424;--hd:#242424;--ph:#242424;--soft:#242424;--card:#fff;--line:#e3e3e3;--dim:rgba(0,0,0,.6);--red:#FF0001;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--fg:#f2f2f2;--card:#1a1a1a;--line:#333;--dim:rgba(0,0,0,.75)}}
:root[data-theme="dark"]{--bg:#0d0d0d;--fg:#f2f2f2;--card:#1a1a1a;--line:#333;--dim:rgba(0,0,0,.75)}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:30}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button:disabled{cursor:not-allowed}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;height:64px;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.logo-btn{display:flex;align-items:center;padding:0}
.logo-img{height:32px;display:block}
nav{display:flex;gap:6px}
nav button{padding:8px 10px;font-size:14px;border-radius:6px}
nav button:hover,nav button.on{background:rgba(255,255,255,.16)}
nav button.on{color:var(--red)}
.backbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);left:0;right:0;height:0;z-index:25}
.btn-back{position:absolute;left:24px;top:14px;padding:8px 16px;font-size:14px;font-weight:600;border-radius:999px;background:var(--gray);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.btn-back:hover{background:var(--red)}
.hidden{display:none!important}
.ph{position:relative;background:var(--ph);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;color:#fff;padding:8px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .3s ease;z-index:1}
.ph span.label{position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.8);opacity:0;transition:opacity .3s ease;padding:0 4px}
.ph:hover::after,.ph:hover span.label{opacity:1}
section.page{display:none;min-height:calc(100vh - 64px);padding-top:64px}
section.page.on{display:block;animation:pageFadeIn .5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.stage{display:flex;align-items:center;justify-content:center;padding:80px 16px 40px;min-height:560px;overflow:hidden}
.stage-track{--s1:clamp(120px,21vw,330px);--s2:calc(var(--s1)*1.8);position:relative;width:100%;height:400px;display:flex;align-items:center;justify-content:center}
.stage .ph{position:absolute;width:clamp(70px,11vw,168px);aspect-ratio:7/10;font-size:13px;border-radius:12px;opacity:0;pointer-events:none;transform:scale(.8);z-index:1;transition:transform .4s cubic-bezier(.25,1,.5,1),width .4s cubic-bezier(.25,1,.5,1),opacity .4s,box-shadow .4s}
.stage .ph[data-pos="-2"]{transform:translateX(calc(var(--s2)*-1)) scale(.85);opacity:.4;pointer-events:auto}
.stage .ph[data-pos="-1"]{transform:translateX(calc(var(--s1)*-1)) scale(.95);opacity:.75;pointer-events:auto;z-index:2}
.stage .ph[data-pos="0"]{width:clamp(110px,17vw,256px);aspect-ratio:256/362;font-size:18px;transform:none;opacity:1;pointer-events:auto;box-shadow:0 12px 36px rgba(0,0,0,.35);z-index:5}
.stage .ph[data-pos="1"]{transform:translateX(var(--s1)) scale(.95);opacity:.75;pointer-events:auto;z-index:2}
.stage .ph[data-pos="2"]{transform:translateX(var(--s2)) scale(.85);opacity:.4;pointer-events:auto}
.ctl{display:flex;justify-content:center;gap:12px;padding-bottom:60px;flex-wrap:wrap}
.ctl button{padding:10px 20px;border-radius:999px;background:var(--gray);color:#fff;font-size:14px}
.ctl button:hover,.ctl .red{background:var(--red)}
.curation-sec{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
.curation-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.curation-head h2{margin:0;font-size:24px;font-weight:700}
.curation-head .more-btn{font-size:14px;color:#888}
.curation-head .more-btn:hover{color:var(--red)}
.curation-body{display:grid;grid-template-columns:280px 1fr;gap:36px;align-items:start}
.curation-left{display:flex;flex-direction:column;gap:16px}
.curation-left .poster-box{width:100%;aspect-ratio:256/362;border-radius:12px;position:relative}
.badge-tag{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:4px;z-index:3}
.curation-left .actions{display:flex;gap:10px}
.curation-left .actions button{flex:1;padding:12px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);transition:background .2s,color .2s}
.curation-left .actions button:hover{background:rgba(128,128,128,.15)}
.curation-left .actions button.btn-book{background:var(--red);color:#fff;border:none}
.curation-left .actions button.btn-book:hover{opacity:.9}
.curation-right{display:flex;flex-direction:column;gap:28px}
.curation-info{display:flex;flex-direction:column;gap:10px;padding-bottom:24px;border-bottom:1px solid var(--line);min-height:180px}
.curation-info .tag-title{font-size:14px;color:var(--red);font-weight:700}
.curation-info h3{margin:0;font-size:28px;font-weight:700}
.curation-info .sub-text{font-size:14px;color:#888}
.curation-info .desc-text{font-size:15px;color:var(--fg);line-height:1.75;margin:6px 0 0;white-space:pre-line}
.curation-sub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.curation-sub-card{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.curation-sub-card .poster-box{aspect-ratio:108/152;border-radius:8px;transition:transform .2s,box-shadow .2s,outline .2s}
.curation-sub-card:hover .poster-box{transform:translateY(-4px)}
.curation-sub-card.on .poster-box{outline:3px solid var(--red);outline-offset:2px}
.curation-sub-card .title{font-size:13px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{max-width:1100px;margin:0 auto;padding:56px 24px 100px;display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,3vw,40px) clamp(10px,2.5vw,32px);align-items:end}
.grid .ph{aspect-ratio:108/152;transition:transform .2s;font-size:14px;border-radius:8px}
.grid .ph:hover{transform:translateY(-6px)}
.grid .ph.big{grid-column:3;grid-row:1;aspect-ratio:164/231;font-size:20px}
.grid .ph:nth-child(1){grid-row:1}
.grid.feat{padding-top:90px}
.h{max-width:1100px;margin:0 auto;padding:64px 24px 0;font-size:22px;font-weight:700}
/* 홈 특별관 소개 */
.th{background:#000;color:#fff;min-height:calc(100vh - 64px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;overflow:hidden;position:relative}
.th .stagebox{position:relative;width:100%;height:min(56vh,460px);display:flex;align-items:center;justify-content:center}
.th .screen{position:relative;width:var(--w,50%);height:var(--h,100%);background:var(--gray);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;z-index:2;border:3px solid #000;outline:1px solid #3a3a3a;transition:width .4s,height .4s;overflow:hidden}
.th .screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65}
.th .screen span{position:relative;z-index:3;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.wing{position:absolute;top:50%;width:18%;height:90%;background:var(--gray);outline:1px solid #3a3a3a;opacity:0;transition:opacity .4s;overflow:hidden}
.wing img{width:100%;height:100%;object-fit:cover;opacity:.4}
.wing.l{left:0;clip-path:polygon(0 0,100% 18%,100% 82%,0 100%);transform:translateY(-50%)}
.wing.r{right:0;clip-path:polygon(0 18%,100% 0,100% 100%,0 82%);transform:translateY(-50%)}
.th.sx .wing{opacity:1}
.desc{color:#bbb;font-size:15px;text-align:center;min-height:24px;padding:0 16px}
.more3d{padding:12px 26px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:15px}
.more3d:hover{opacity:.9}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px clamp(16px,3.5vw,48px);padding:0 16px 60px}
.tabs button{font-size:clamp(16px,2.2vw,30px);color:#999;padding:6px 4px;border-bottom:2px solid transparent}
.tabs button:hover{color:#ddd}
.tabs button.on{color:#fff;border-color:var(--red)}
/* 특별관 3D 상세 */
.tp{background:#000;color:#fff;min-height:calc(100vh - 64px)}
.tp-in{max-width:1100px;margin:0 auto;padding:72px 24px 20px}
.tp-in h2{margin:0 0 6px;font-size:26px}
.tp-in .desc{text-align:left;padding:0;margin-bottom:20px}
.tp .tabs{padding:28px 16px 32px}
.v3{position:relative;aspect-ratio:16/10;min-height:320px;border-radius:16px;overflow:hidden;background:#07070a}
.v3 canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.v3err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px}
.tip{position:absolute;pointer-events:none;background:#fff;color:#111;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;display:none;white-space:nowrap;z-index:3}
.inb{position:absolute;right:12px;bottom:12px;border:2px solid #fff;border-radius:8px;pointer-events:none;display:none;z-index:2;color:#fff;font-size:11px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.inb span{position:absolute;left:6px;top:4px;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:999px}
.vbar{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:10px;z-index:3}
.vbar button{background:var(--red);padding:6px 12px;border-radius:999px;font-weight:700;color:#fff;flex:none}
/* 모달 */
.ov{position:fixed;inset:0;background:var(--dim);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:24px;width:min(880px,100%);max-height:90vh;overflow:auto;padding:40px;position:relative;animation:up .25s}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}*{transition:none!important}}
.x{position:absolute;right:16px;top:12px;font-size:28px;line-height:1;padding:6px 10px}
.top{display:flex;gap:32px}
.top .ph{width:210px;aspect-ratio:210/297;flex:none;border-radius:8px}
.info{display:flex;flex-direction:column;flex:1}
.info h2{margin:0 0 6px;font-size:26px}
.info p{margin:0;color:#888}
.acts{display:flex;gap:14px;margin-top:auto;padding-top:20px}
.circ{width:56px;height:56px;border-radius:50%;background:var(--gray);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
button.circ:hover,button.circ.on,button.circ.go{background:var(--red)}
.body{margin:36px 0 28px;line-height:1.75;max-width:70ch}
.cast{display:flex;gap:24px;flex-wrap:wrap}
.cast div{text-align:center;font-size:12px}
.cast .circ{width:92px;height:92px;margin-bottom:6px;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--gray);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:60;pointer-events:none;border:1px solid #444}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* 예매 */
.bk{max-width:1100px;margin:0 auto;padding:76px 24px 100px;display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start}
.bk.one{grid-template-columns:1fr;max-width:560px}
.steps{grid-column:1/-1;display:flex;gap:8px}
.steps div{flex:1;padding:10px 4px;border-bottom:3px solid var(--line);font-size:14px;color:#888}
.steps div.on{border-color:var(--red);color:var(--fg);font-weight:700}
.steps div.done{border-color:var(--gray);color:var(--fg)}
.bk h3{margin:28px 0 12px;font-size:16px}
.bk h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 16px;border-radius:999px;background:var(--gray);color:#fff;font-size:14px}
.chip:hover{background:#3a3a3a}
.chip.on{background:var(--red)}
.shows{display:grid;gap:8px}
.show{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:12px;padding:16px 20px;border:1px solid var(--line);border-radius:12px;text-align:left}
.show b{font-size:20px}
.show em{font-style:normal;color:#888;font-size:13px}
.show:hover{border-color:var(--gray)}
.show.on{background:var(--gray);color:#fff;border-color:var(--red)}
.show.on em{color:#ccc}
.scr{width:70%;margin:0 auto 28px;padding:8px;text-align:center;font-size:12px;letter-spacing:.3em;background:var(--gray);color:#fff;border-radius:4px 4px 40px 40px/4px 4px 14px 14px}
.row{display:flex;gap:6px;justify-content:center;margin-bottom:6px;align-items:center}
.row i{width:18px;font-style:normal;font-size:12px;color:#888}
.seat{width:clamp(20px,5.5vw,34px);aspect-ratio:1;border-radius:6px 6px 3px 3px;background:var(--gray);color:#fff;font-size:10px}
.seat:hover:not(:disabled){background:#555}
.seat.gap{margin-right:20px}
.seat.t{opacity:.15}
.seat.on{background:var(--red)}
.legend{display:flex;gap:16px;justify-content:center;margin-top:20px;font-size:12px;color:#888}
.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px;background:var(--gray)}
.legend .a:before{background:var(--red)}
.legend .t:before{opacity:.15}
.sum{position:sticky;top:96px;background:var(--gray);color:#fff;border-radius:16px;padding:24px}
.sum h4{margin:0 0 12px;font-size:20px}
.sum p{margin:6px 0;color:#ccc;font-size:14px}
.tot{font-size:26px;font-weight:700;margin:20px 0 16px;color:#fff}
.cta{width:100%;padding:14px;border-radius:999px;background:var(--red);color:#fff;font-weight:700;font-size:16px}
.cta:disabled{background:#555;color:#999}
.tk{border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px;background:var(--card)}
.tk .hd{background:var(--red);color:#fff;padding:20px 24px}
.tk .hd small{opacity:.85}
.tk .hd h2{margin:4px 0 0;font-size:24px}
.tk .bd{padding:20px 24px;display:grid;grid-template-columns:90px 1fr;gap:10px 8px;font-size:14px}
.tk .bd span{color:#888}
.tk .bd.sep{border-top:2px dashed var(--line)}
.empty{text-align:center;padding:60px 0;color:#888}
/* 프로필 페이지 (기존 디자인 시스템 & 버튼 규격 준수) */
.pf-wrap{max-width:1100px;margin:0 auto;padding:76px 24px 100px;display:grid;grid-template-columns:320px 1fr;gap:36px;align-items:start}
.pf-card{background:var(--gray);color:#fff;border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.pf-top{display:flex;align-items:center;gap:16px}
.pf-top .circ{width:56px;height:56px;background:var(--red);font-weight:700;font-size:16px}
.pf-name{font-size:20px;font-weight:700;margin:0 0 4px}
.pf-grade{font-size:12px;color:#bbb}
.pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 0;border-top:1px solid rgba(255,255,255,.12);border-bottom:1px solid rgba(255,255,255,.12);text-align:center}
.pf-stats b{display:block;font-size:18px;margin-bottom:4px}
.pf-stats span{font-size:12px;color:#aaa}
.barcode{background:#fff;color:#111;border-radius:12px;padding:14px 16px;text-align:center}
.barcode .bars{height:38px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 5px,#111 5px 9px,#fff 9px 11px,#111 11px 12px,#fff 12px 16px);margin-bottom:8px}
.barcode small{font-size:12px;letter-spacing:.18em;font-weight:600;color:#333}
.pf-main{display:flex;flex-direction:column;gap:32px}
.pf-sec h3{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pf-wish{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pf-wish-item{display:flex;flex-direction:column;gap:8px}
.pf-wish-item .ph{aspect-ratio:108/152;border-radius:8px;cursor:pointer}
.pf-wish-item .w-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-wish-item .w-acts{display:flex;gap:6px}
.pf-wish-item .w-acts button{flex:1;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.pf-wish-item .w-acts button.go{background:var(--red);color:#fff;border:none}
@media(max-width:850px){.curation-body,.pf-wrap{grid-template-columns:1fr}.curation-sub-grid,.pf-wish{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.bk{grid-template-columns:1fr}.sum{position:static}}
@media(max-width:700px){header{padding:0 12px}nav button{padding:6px;font-size:12px}.logo-img{height:26px}.btn-back{left:12px}.top{flex-direction:column}.top .ph{width:60%}.modal{padding:24px}.stage .ph[data-pos="-2"],.stage .ph[data-pos="2"]{opacity:0}.stage-track{--s1:130px}.seat.gap{margin-right:10px}.show{grid-template-columns:64px 1fr auto}}
</style>
</head>
<body>
<header>
  <button class="logo-btn" onclick="go('home')" aria-label="홈으로">
    <img class="logo-img" src="img/logo.svg" alt="CGV" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <span style="display:none;font-size:22px;font-weight:700">CGV</span>
  </button>
  <nav>
    <button data-n="my">내 예매/예약</button>
    <button data-n="store">매점</button>
    <button data-n="profile">프로필</button>
  </nav>
</header>
<div class="backbar"><button class="btn-back hidden" id="btnBack" onclick="goBack()" aria-label="이전 페이지로">‹ 뒤로</button></div>

<section class="page" id="home">
  <div class="stage"><div class="stage-track" id="stageTrack"></div></div>
  <div class="ctl">
    <button onclick="rot(-1)" aria-label="이전">‹ 이전</button>
    <button onclick="go('movies')">전체 영화 보기</button>
    <button class="red" onclick="startBooking(cur)">예매하기</button>
    <button onclick="rot(1)" aria-label="다음">다음 ›</button>
  </div>
  <div class="curation-sec">
    <div class="curation-head"><h2>큐레이션</h2><button class="more-btn" onclick="go('movies')">큐레이션 더보기 +</button></div>
    <div class="curation-body" id="curationBody"></div>
  </div>
  <div class="th" id="thHome" style="min-height:0;padding:80px 0 0"></div>
</section>

<section class="page" id="movies"><div class="h">상영 중인 영화</div><div class="grid feat" id="mg"></div></section>

<section class="page" id="theater">
  <div class="tp"><div class="tp-in">
    <h2>특별관 3D 체험</h2>
    <p class="desc" id="tpDesc"></p>
    <div class="v3" id="v3"><div class="tip" id="tip"></div><div class="inb" id="inb"></div><div class="vbar" id="vbar"></div></div>
    <div class="tabs" id="tpTabs"></div>
    <div class="ctl" style="padding-bottom:60px"><button class="red" onclick="bookHall()">이 상영관으로 예매하기</button></div>
  </div></div>
</section>

<section class="page" id="store"><div class="h">매점</div><div class="grid" id="sg" style="padding-top:24px"></div></section>
<section class="page" id="booking"><div class="bk" id="bk"></div></section>
<section class="page" id="my"><div class="bk one" id="myList"></div></section>
<section class="page" id="profile"><div class="pf-wrap" id="pfWrap"></div></section>

<div class="ov" id="ov"><div class="modal" id="md" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const movies=[
{id:0,t:"룩백",poster:"img/lookback.jpg",sub:"애니메이션 · 58분",d:"학교 신문에서 네컷 만화를 그리는 자신만만한 소녀 '후지노'와 방 안에 틀어박힌 외톨이 '쿄모토'. 만화가 세상의 전부였던 시절, 두 소녀의 눈부신 사계절이 채워지기 시작한다."},
{id:1,t:"최종면접",poster:"img/Final Interview.jpg",sub:"스릴러 · 104분",d:"대기업 입사를 위한 마지막 단계, 밀실에서 펼쳐지는 기이하고 섬뜩한 최종 면접. 합격을 위해 서로를 배신하며 밝혀지는 서늘한 진실."},
{id:2,t:"오디세이",poster:"img/The Odyssey.jpg",sub:"SF · 135분",d:"미지의 위성으로 떠나는 사상 최대의 우주 탐사 프로젝트. 신비로운 항로 끝에 기다리고 있는 인류의 원초적 기원과 절망."},
{id:3,t:"Heart of the Beast",poster:"img/Heart of the Beast.jpg",sub:"액션 · 112분",d:"야수의 심장을 가진 자들의 격렬한 사투. 거대한 음모 속에서 생존하기 위한 주인공의 처절한 반격이 시작된다."},
{id:4,t:"디거",poster:"img/Digger.jpg",sub:"범죄 · 126분",d:"땅속 깊은 곳에 숨겨진 보물을 파헤치는 미스터리 탐사원들. 그들이 발굴한 것은 상상을 초월하는 위험한 유물이었다."},
{id:5,t:"치이카와",poster:"img/Chiikawa.jpg",sub:"애니메이션 · 85분",d:"작고 귀여운 치이카와와 친구들의 파란만장한 일상 대모험! 귀여움 뒤에 숨겨진 험난한 노동과 감동의 순간들."},
{id:6,t:"집착",poster:"img/Obsession.jpg",sub:"미스터리 · 110분",d:"벗어날 수 없는 굴레와 빗나간 집착. 어둠 속에서 서서히 다가오는 기괴한 그림자의 정체는 무엇인가."},
{id:7,t:"인턴",poster:"img/Intern.jpg",sub:"드라마 · 121분",d:"창업 1년 만에 성공을 거둔 패션 스타트업에 70세 시니어 인턴이 출근하면서 일어나는 가슴 따뜻한 성장 드라마."},
{id:8,t:"부활남",poster:"img/red.jpg",sub:"액션 · 115분",d:"죽으면 3일 만에 부활하는 능력을 가진 청년. 거대한 악당 조직에 맞서 싸우는 통쾌하고 화려한 웹툰 원작 액션."},
{id:9,t:"브루넬로",poster:"img/be.jpg",sub:"드라마 · 108분",d:"우아한 선구자의 미학과 철학. 예술과 삶의 경계에서 펼쳐지는 아름답고 깊이 있는 휴먼 스토리."},
{id:10,t:"요루시카",poster:"img/yorushika.jpg",sub:"공연실황 · 95분",d:"감성적인 음악과 환상적인 그래픽 연출이 어우러진 특설 라이브 콘서트 실황 극장판."},
{id:11,t:"HOPE",poster:"img/HOPE.jpg",sub:"드라마 · 118분",d:"절망의 끝에서 발견한 작은 희망의 빛. 서로의 아픔을 보듬어주며 다시 일어서는 가족의 이야기."},
{id:12,t:"라라랜드",poster:"img/LA LA LAND.jpg",sub:"로맨스 · 127분",d:"꿈을 쫓는 청춘들의 열정과 사랑. 재즈 피아니스트 세바스찬과 배우 지망생 미아가 그려내는 아름다운 사계절."}];
const cast=["주연 A","주연 B","조연 C","감독"];
const items=[
{t:"더블 세트",poster:"img/Dubleset.png",sub:"13,000원",d:"팝콘 2 + 음료 2 구성의 대표 콤보 세트입니다."},
{t:"싱글 세트",poster:"img/Sset.png",sub:"8,500원",d:"혼자서 즐기기 좋은 팝콘 1 + 음료 1 세트입니다."},
{t:"라지 세트",poster:"img/largeset.png",sub:"15,000원",d:"풍성한 푸드 스낵과 음료가 포함된 넉넉한 세트입니다."},
{t:"맥주 세트",poster:"img/beerset.png",sub:"12,000원",d:"시원한 맥주와 어울리는 스낵 콤보 세트입니다."},
{t:"오징어 튀김",poster:"img/calamari.png",sub:"6,500원",d:"바삭하고 짭조름한 극장 인기 핑거푸드 오징어 튀김입니다."},
{t:"핫도그",poster:"img/hotdog.png",sub:"5,000원",d:"육즙 가득한 소시지가 들어간 갓 구운 핫도그입니다."},
{t:"나초",poster:"img/nacho.png",sub:"5,000원",d:"고소한 나초 칩과 치즈 소스의 환상적인 조합입니다."},
{t:"레몬 에이드",poster:"img/lemon.png",sub:"4,500원",d:"상큼하고 청량한 시트러스 레몬 에이드입니다."},
{t:"생맥주",poster:"img/beer.png",sub:"6,000원",d:"영화와 함께 즐기는 시원한 프리미엄 생맥주입니다."},
{t:"컵강정",poster:"img/cup.png",sub:"7,000원",d:"톡 쏘는 청량함의 대표 탄산음료와 닭강정의 만남!"}];
const fmts={
laser:["laser","선명한 레이저 영사로 더 깊은 검정과 밝은 화면",{w:"50%",h:"100%"},"img/lookback.jpg"],
IMAX:["IMAX","더 크고 높은 화면비로 장면 가득 몰입",{w:"62%",h:"100%"},"img/The Odyssey.jpg"],
SCREENX:["SCREENX","정면과 좌우 벽면까지 이어지는 270° 화면",{w:"60%",h:"85%"},"img/LA LA LAND.jpg"],
"4DX":["4DX","움직이는 좌석과 바람·향기 효과",{w:"90%",h:"100%"},"img/red.jpg"],
"Dolby Atmos":["Dolby Atmos","머리 위까지 움직이는 입체 사운드",{w:"60%",h:"100%"},"img/yorushika.jpg"]};
const TABS=Object.keys(fmts);
const $=s=>document.querySelector(s);
let cur=2,fmt="IMAX",tt,curationCurId=0;
let WISH=[];try{WISH=JSON.parse(localStorage.getItem("cgvWish")||"[]")}catch(e){}
let THEME="auto";try{THEME=localStorage.getItem("cgvTheme")||"auto"}catch(e){}

const posterHtml=(u,t)=>`<img src="${u}" alt="${t}" onerror="this.style.display='none'"><span class="label">${t}</span>`;
function go(p){location.hash=p}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200)}
const PAGES=["home","movies","theater","store","booking","my","profile"];
const page=()=>{const p=location.hash.slice(1);return PAGES.includes(p)?p:"home"};

function applyTheme(t){
  THEME=t;
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  try{localStorage.setItem("cgvTheme",t)}catch(e){}
  if(page()==="profile")renderProfile();
}
applyTheme(THEME);

/* 라우팅 */
function route(){
  const p=page();
  document.querySelectorAll(".page").forEach(e=>e.classList.toggle("on",e.id===p));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.n===p));
  $("#btnBack").classList.toggle("hidden",p==="home");
  closeM();scrollTo(0,0);
  if(p==="booking")renderBooking();
  if(p==="my")renderMy();
  if(p==="theater")open3D();
  if(p==="profile")renderProfile();
}
function goBack(){
  if(page()==="booking"&&B.step>1&&B.step<4){B.step--;renderBooking();scrollTo(0,0)}
  else if(page()==="booking"&&B.step===4)go("home");
  else if(history.length>1)history.back();else go("home");
}
addEventListener("hashchange",route);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.n));

/* 캐러셀 */
function initStage(){
  const tr=$("#stageTrack");tr.innerHTML="";
  movies.forEach((m,i)=>{const b=document.createElement("button");b.className="ph";b.innerHTML=posterHtml(m.poster,m.t);b.setAttribute("aria-label",m.t);b.dataset.id=i;tr.appendChild(b)});
  updateStage();
}
function updateStage(){
  document.querySelectorAll("#stageTrack .ph").forEach(c=>{
    const i=+c.dataset.id;let d=i-cur,h=Math.floor(movies.length/2);
    if(d<-h)d+=movies.length;if(d>h)d-=movies.length;
    c.dataset.pos=d;c.onclick=()=>d===0?openM(movies[i],"영화"):(cur=i,updateStage());
  });
}
function rot(d){cur=(cur+d+movies.length)%movies.length;updateStage()}
addEventListener("keydown",e=>{
  if(e.key==="Escape")closeM();
  if(page()==="home"&&!$("#ov").classList.contains("on")){if(e.key==="ArrowLeft")rot(-1);if(e.key==="ArrowRight")rot(1)}
});

/* 큐레이션 */
function drawCuration(){
  const el=$("#curationBody");if(!el)return;
  const f=movies[curationCurId],sub=movies.slice(0,5);
  el.innerHTML=`<div class="curation-left"><div class="poster-box ph"><div class="badge-tag">CGV SPECIAL</div>${posterHtml(f.poster,f.t)}</div>
  <div class="actions"><button onclick="openM(movies[${f.id}],'영화')">상세정보</button><button class="btn-book" onclick="startBooking(${f.id})">예매</button></div></div>
  <div class="curation-right"><div class="curation-info"><div class="tag-title">#필름소사이어티</div><h3>${f.t}</h3><div class="sub-text">${f.sub}</div><p class="desc-text">${f.d}</p></div>
  <div class="curation-sub-grid">${sub.map(m=>`<div class="curation-sub-card${m.id===f.id?" on":""}" onclick="selectCurationMovie(${m.id})"><div class="poster-box ph">${posterHtml(m.poster,m.t)}</div><div class="title">${m.t}</div></div>`).join("")}</div></div>`;
}
function selectCurationMovie(id){curationCurId=id;drawCuration()}

/* 홈 특별관 소개 → 자세히보기 → 특별관 3D 페이지 */
function mountHome(){
  const el=$("#thHome");
  el.innerHTML=`<div class="stagebox"><div class="wing l"><img class="wing-img" src="" alt=""></div>
  <div class="screen" role="button" tabindex="0" aria-label="특별관 자세히 보기" style="cursor:pointer"><img class="screen-img" src="" alt="" onerror="this.style.display='none'"><span class="screen-txt"></span></div>
  <div class="wing r"><img class="wing-img" src="" alt=""></div></div>
  <div class="desc"></div><button class="more3d" onclick="go('theater')">자세히보기 · 3D로 둘러보기 ›</button><div class="tabs"></div>`;
  const sc=el.querySelector(".screen");sc.onclick=()=>go("theater");sc.onkeydown=e=>{if(e.key==="Enter")go("theater")};
  [el.querySelector(".tabs"),$("#tpTabs")].forEach(t=>TABS.forEach(k=>{const b=document.createElement("button");b.textContent=k;b.dataset.k=k;b.onclick=()=>showT(k);t.appendChild(b)}));
}
function showT(k){
  fmt=k;const f=fmts[k],el=$("#thHome"),s=el.querySelector(".screen");
  s.style.setProperty("--w",f[2].w);s.style.setProperty("--h",f[2].h);
  el.querySelector(".screen-txt").textContent=f[0];
  const im=el.querySelector(".screen-img");im.src=f[3];im.style.display="block";
  el.querySelectorAll(".wing-img").forEach(w=>w.src=f[3]);
  el.classList.toggle("sx",k==="SCREENX");
  el.querySelector(".desc").textContent=f[1];$("#tpDesc").textContent=f[0]+" · "+f[1];
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
  if(T.ok&&page()==="theater"){buildHall(fmt);paint();ui()}
}
function bookHall(){
  const pickedSeat=T.sel?ROWS[T.sel[0]]+(T.sel[1]+1):null;
  const targetShow=shows()[TABS.indexOf(fmt)];
  startBooking(cur);
  B.show=targetShow;
  if(pickedSeat&&!isTaken(targetShow,T.sel[0],T.sel[1])){
    B.seats=[pickedSeat];
    B.step=2;
  }
  renderBooking();
}

/* 그리드 */
function drawGrid(el,list,label){
  el.innerHTML="";
  list.forEach((m,i)=>{const b=document.createElement("button");b.className="ph"+(label==="영화"&&i===2?" big":"");b.innerHTML=posterHtml(m.poster,m.t);b.onclick=()=>openM(m,label);el.appendChild(b)});
}

/* 찜하기 토글 */
function toggleWish(m,label){
  const key=`${label}:${m.t}`;
  const idx=WISH.findIndex(w=>w.key===key);
  if(idx>=0){WISH.splice(idx,1);toast("찜을 취소했어요")}
  else{WISH.unshift({key,label,id:m.id??null,t:m.t,poster:m.poster,sub:m.sub});toast("찜 목록에 추가했어요")}
  try{localStorage.setItem("cgvWish",JSON.stringify(WISH))}catch(e){}
  if(page()==="profile")renderProfile();
  return idx<0;
}

/* 모달 */
function openM(m,label){
  const isM=label==="영화",acts=isM?["예매","찜","공유","예고편"]:["담기","찜","공유","주문"];
  const wished=WISH.some(w=>w.key===`${label}:${m.t}`);
  $("#md").innerHTML=`<button class="x" aria-label="닫기" onclick="closeM()">×</button>
  <div class="top"><div class="ph">${posterHtml(m.poster,m.t)}</div><div class="info"><h2>${m.t}</h2><p>${m.sub}</p>
  <div class="acts">${acts.map(a=>`<button class="circ${a==="예매"?" go":""}${a==="찜"&&wished?" on":""}" data-a="${a}">${a}</button>`).join("")}</div></div></div>
  <p class="body">${m.d}</p>
  <div class="cast">${(isM?cast:["기본","라지","치즈","세트"]).map(c=>`<div><div class="circ">${c[0]}</div>${c}</div>`).join("")}</div>`;
  $("#md").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;
    if(a==="예매")startBooking(m.id);
    else if(a==="찜"){const on=toggleWish(m,label);b.classList.toggle("on",on)}
    else if(a==="주문"||a==="담기")toast(`${m.t} ${a==="주문"?"주문을 시작해요":"장바구니에 담았어요"}`);
    else if(a==="공유")toast("링크를 복사했어요");
    else toast("예고편을 불러오는 중이에요");
  });
  $("#ov").classList.add("on");$("#md .x").focus();
}
function closeM(){$("#ov").classList.remove("on")}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeM()};

/* ---------- 가상 예매 (2D · 예매에 집중) ---------- */
const B={step:1,movie:2,day:0,show:null,seats:[],pay:"신용/체크카드"};
let MY=[];try{MY=JSON.parse(localStorage.getItem("cgvMy")||"[]")}catch(e){}
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return{l:`${d.getMonth()+1}/${d.getDate()}`,w:"일월화수목금토"[d.getDay()]}});
const TIMES=["10:20","13:05","16:10","19:30","22:10"];
const SURCH={laser:2000,IMAX:4000,SCREENX:3000,"4DX":5000,"Dolby Atmos":3000};
const ROWS="ABCDEFGH",COLS=12;
const won=n=>n.toLocaleString()+"원";
const shows=()=>TIMES.map((t,n)=>({t,n,hall:TABS[(n+B.day)%5]}));
const isTaken=(s,r,c)=>((r+1)*7+(c+1)*13+B.day*3+s.n*5+B.movie)%5===0;
const left=s=>{let k=0;for(let r=0;r<8;r++)for(let c=0;c<COLS;c++)if(!isTaken(s,r,c))k++;return k};
function startBooking(i){
  Object.assign(B,{step:1,movie:i,day:0,show:null,seats:[]});closeM();
  if(page()==="booking")renderBooking();else go("booking");
}
function pick(k,v){
  if(k==="movie"){B.movie=v;B.show=null;B.seats=[]}
  if(k==="day"){B.day=v;B.show=null;B.seats=[]}
  if(k==="show"){B.show=shows()[v];B.seats=[]}
  if(k==="pay")B.pay=v;
  renderBooking();
}
function seat(id){
  const i=B.seats.indexOf(id);
  if(i>=0)B.seats.splice(i,1);else if(B.seats.length>=4)return toast("최대 4석까지 선택할 수 있어요");else B.seats.push(id);
  renderBooking();
}
function next(){
  if(B.step<3){B.step++;renderBooking();scrollTo(0,0);return}
  const m=movies[B.movie],price=14000+SURCH[B.show.hall];
  B.done={no:"CGV"+String(Date.now()).slice(-8),movie:m.t,date:`${days[B.day].l} (${days[B.day].w})`,time:B.show.t,hall:B.show.hall,seats:[...B.seats].sort(),total:price*B.seats.length,pay:B.pay};
  MY.unshift(B.done);try{localStorage.setItem("cgvMy",JSON.stringify(MY))}catch(e){}
  B.step=4;renderBooking();scrollTo(0,0);
}
const ticket=t=>`<div class="tk"><div class="hd"><small>${t.date} ${t.time}</small><h2>${t.movie}</h2></div>
<div class="bd"><span>상영관</span><b>${t.hall}관</b><span>좌석</span><b>${t.seats.join(", ")}</b><span>결제금액</span><b>${won(t.total)}</b></div>
<div class="bd sep"><span>예매번호</span><b>${t.no}</b><span>결제수단</span><b>${t.pay}</b></div></div>`;
function renderBooking(){
  const el=$("#bk"),m=movies[B.movie],s=B.show,price=s?14000+SURCH[s.hall]:0,total=price*B.seats.length;
  const steps=["영화·시간","좌석","결제","완료"].map((x,i)=>`<div class="${B.step===i+1?"on":i+1<B.step?"done":""}">${i+1}. ${x}</div>`).join("");
  el.classList.toggle("one",B.step===4);
  if(B.step===4){
    el.innerHTML=`<div class="steps">${steps}</div><div><h2 style="margin:0 0 6px">예매가 완료됐어요</h2><p style="color:#888;margin:0 0 20px">가상 예매입니다. 실제 결제는 이루어지지 않아요.</p>${ticket(B.done)}
    <div class="ctl" style="padding:20px 0 0"><button onclick="go('my')">내 예매 보기</button><button class="red" onclick="go('home')">홈으로</button></div></div>`;return;
  }
  let main="";
  if(B.step===1){
    main=`<h3>영화</h3><div class="chips">${movies.map((x,i)=>`<button class="chip${i===B.movie?" on":""}" onclick="pick('movie',${i})">${x.t}</button>`).join("")}</div>
    <h3>날짜</h3><div class="chips">${days.map((x,i)=>`<button class="chip${i===B.day?" on":""}" onclick="pick('day',${i})">${x.l} (${x.w})</button>`).join("")}</div>
    <h3>상영 시간</h3><div class="shows">${shows().map(x=>`<button class="show${s&&s.n===x.n?" on":""}" onclick="pick('show',${x.n})"><b>${x.t}</b><span>${x.hall}관</span><em>잔여 ${left(x)}석</em></button>`).join("")}</div>`;
  }else if(B.step===2){
    let rows="";
    for(let r=0;r<8;r++){rows+=`<div class="row"><i>${ROWS[r]}</i>`;
      for(let c=0;c<COLS;c++){const id=ROWS[r]+(c+1),t=isTaken(s,r,c);
        rows+=`<button class="seat${t?" t":""}${B.seats.includes(id)?" on":""}${c===5?" gap":""}" ${t?"disabled":""} aria-label="${id}" onclick="seat('${id}')">${c+1}</button>`}
      rows+="</div>"}
    main=`<h3>좌석 선택 <small style="color:#888;font-weight:400">(최대 4석)</small></h3><div class="scr">SCREEN</div>${rows}<div class="legend"><span>선택 가능</span><span class="a">선택됨</span><span class="t">예매 완료</span></div>`;
  }else{
    main=`<h3>결제 수단</h3><div class="chips">${["신용/체크카드","카카오페이","네이버페이","휴대폰 결제"].map(x=>`<button class="chip${B.pay===x?" on":""}" onclick="pick('pay','${x}')">${x}</button>`).join("")}</div>
    <h3>결제 내역</h3><div class="tk"><div class="bd"><span>일반 요금</span><b>${won(14000)} × ${B.seats.length}</b><span>${s.hall}관 추가</span><b>${won(SURCH[s.hall])} × ${B.seats.length}</b><span>총 결제금액</span><b style="color:var(--red)">${won(total)}</b></div></div>`;
  }
  const ok=B.step===1?!!s:B.seats.length>0;
  el.innerHTML=`<div class="steps">${steps}</div><div>${main}</div>
  <aside class="sum"><h4>${m.t}</h4><p>${days[B.day].l} (${days[B.day].w}) ${s?s.t+" · "+s.hall+"관":"시간을 선택해 주세요"}</p><p>좌석 ${B.seats.length?[...B.seats].sort().join(", "):"-"}</p>
  <div class="tot">${won(total)}</div><button class="cta" ${ok?"":"disabled"} onclick="next()">${B.step===3?won(total)+" 결제하기":["좌석 선택하기","결제 단계로"][B.step-1]}</button></aside>`;
}
function renderMy(){
  $("#myList").innerHTML=`<div class="steps"><div class="on">내 예매/예약</div></div><div>${MY.length?MY.map(ticket).join(""):`<div class="empty">아직 예매 내역이 없어요.<div class="ctl" style="padding:20px 0 0"><button class="red" onclick="startBooking(cur)">예매하러 가기</button></div></div>`}</div>`;

function removeWish(i){

  try{localStorage.setItem("cgvWish",JSON.stringify(WISH))}catch(e){}
  toast("찜 목록에서 삭제했어요");

/* ---------- 특별관 3D 체험 (three.js) ---------- */
const T={mode:"over",hov:null,last:null,sel:null,yaw:0,pitch:0};
const SX=c=>(c-5.5)*.62+(c<6?-.35:.35),SZ=r=>4+r*1.15,SY=r=>r*.38;
const SEYE=(r,c)=>new THREE.Vector3(SX(c),SY(r)+1.2,SZ(r)-.05);
const sid=i=>ROWS[Math.floor(i/COLS)]+(i%COLS+1);
function viewOver(){T.mode="over";T.yaw=T.pitch=0;ui()}

function init3D(){
  const r=new THREE.WebGLRenderer({antialias:true});
  r.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const sc=new THREE.Scene();sc.background=new THREE.Color(0x07070a);
  T.r=r;T.sc=sc;T.cam=new THREE.PerspectiveCamera(55,1.6,.1,60);T.icam=new THREE.PerspectiveCamera(62,16/9,.1,60);
  T.OVP=new THREE.Vector3(0,7.8,14.6);T.OVL=new THREE.Vector3(0,2.4,2);
  T.cp=T.OVP.clone();T.ct=T.OVL.clone();T.col=new THREE.Color();T.ray=new THREE.Raycaster();T.m=new THREE.Vector2();
  sc.add(new THREE.AmbientLight(0xffffff,.55));
  [[0,4,3,0xbcd0ff,.9],[0,8,9,0xffffff,.55]].forEach(a=>{const p=new THREE.PointLight(a[3],a[4],40);p.position.set(a[0],a[1],a[2]);sc.add(p)});
  const room=new THREE.Mesh(new THREE.BoxGeometry(22,9,16.5),new THREE.MeshStandardMaterial({color:0x1a1a22,side:THREE.BackSide,roughness:1}));
  room.position.set(0,4.5,7.75);sc.add(room);
  for(let i=0;i<8;i++){const h=SY(i)+.3,m=new THREE.Mesh(new THREE.BoxGeometry(17,h,1.15),new THREE.MeshStandardMaterial({color:0x26262e,roughness:1}));m.position.set(0,h/2,SZ(i));sc.add(m)}
  const n=8*COLS,dm=new THREE.Object3D(),mk=g=>new THREE.InstancedMesh(g,new THREE.MeshStandardMaterial({roughness:.7}),n);
  T.base=mk(new THREE.BoxGeometry(.5,.14,.5));T.back=mk(new THREE.BoxGeometry(.5,.55,.1));
  for(let q=0;q<8;q++)for(let c=0;c<COLS;c++){const i=q*COLS+c;
    dm.position.set(SX(c),SY(q)+.4,SZ(q));dm.updateMatrix();T.base.setMatrixAt(i,dm.matrix);
    dm.position.set(SX(c),SY(q)+.7,SZ(q)+.22);dm.updateMatrix();T.back.setMatrixAt(i,dm.matrix)}
  sc.add(T.base,T.back);

  const cv=r.domElement;let dn=null;
  const hit=e=>{const b=cv.getBoundingClientRect();T.m.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1);T.ray.setFromCamera(T.m,T.cam);const h=T.ray.intersectObjects([T.base,T.back])[0];return h?h.instanceId:null};
  cv.addEventListener("pointerdown",e=>{dn={x:e.clientX,y:e.clientY,mv:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",e=>{
    if(T.mode==="seat"){
      if(dn){const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>3)dn.mv=true;
        T.yaw=Math.max(-.9,Math.min(.9,T.yaw-dx*.004));T.pitch=Math.max(-.5,Math.min(.5,T.pitch+dy*.004));dn.x=e.clientX;dn.y=e.clientY}
      return;
    }
    const i=hit(e),tip=$("#tip");
    if(i!==T.hov){T.hov=i;paint()}
    if(i==null)tip.style.display="none";
    else{const b=cv.getBoundingClientRect();tip.style.display="block";tip.style.left=(e.clientX-b.left+14)+"px";tip.style.top=(e.clientY-b.top+14)+"px";tip.textContent=sid(i)+" · 클릭하면 이 자리에서 보기"}
    cv.style.cursor=i!=null?"pointer":"default";
  });
  cv.addEventListener("pointerup",e=>{
    const d=dn;dn=null;if(T.mode==="seat"||(d&&d.mv))return;
    const i=hit(e);if(i==null)return;
    T.mode="seat";T.sel=[Math.floor(i/COLS),i%COLS];T.last=i;T.yaw=T.pitch=0;
    $("#tip").style.display="none";paint();ui();
  });
  cv.addEventListener("pointerleave",()=>{if(T.hov!=null){T.hov=null;paint()}$("#tip").style.display="none"});
  addEventListener("resize",()=>{if(page()==="theater")resize()});
  T.ok=true;loop();
}
function screenTex(k){
  const cv=document.createElement("canvas");cv.width=1024;cv.height=512;const g=cv.getContext("2d"),tx=new THREE.CanvasTexture(cv);
  const draw=im=>{
    const gr=g.createLinearGradient(0,0,1024,512);gr.addColorStop(0,"#1b2a52");gr.addColorStop(1,"#6a0b14");g.fillStyle=gr;g.fillRect(0,0,1024,512);
    if(im){const s=Math.max(1024/im.width,512/im.height),w=im.width*s,h=im.height*s;g.drawImage(im,(1024-w)/2,(512-h)/2,w,h);g.fillStyle="rgba(0,0,0,.35)";g.fillRect(0,0,1024,512)}
    g.fillStyle="#fff";g.textAlign="center";g.font="700 84px sans-serif";g.fillText(k,512,275);tx.needsUpdate=true};
  draw();const im=new Image();im.onload=()=>draw(im);im.src=fmts[k][3];return tx;
}
function buildHall(k){
  if(T.hall)T.sc.remove(T.hall);
  const g=new THREE.Group(),big=k==="IMAX",W=big?15:12,H=big?7:5.2,cy=big?4.5:3.4,tx=screenTex(k);
  const scr=new THREE.Mesh(new THREE.PlaneGeometry(W,H),new THREE.MeshBasicMaterial({map:tx}));scr.position.set(0,cy,-.3);g.add(scr);
  if(k==="SCREENX")[-1,1].forEach(d=>{const w=new THREE.Mesh(new THREE.PlaneGeometry(5,H*.9),new THREE.MeshBasicMaterial({map:tx,color:0x9aa6cc,side:THREE.DoubleSide}));w.position.set(d*(W/2+2.1),cy,1.6);w.rotation.y=-d*.55;g.add(w)});
  if(k==="Dolby Atmos")for(let i=0;i<14;i++){const sp=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),new THREE.MeshBasicMaterial({color:0xffe08a}));sp.position.set((i%2?-1:1)*5.5,8.7,1.5+Math.floor(i/2)*2);g.add(sp)}
  T.hall=g;T.sc.add(g);T.ty=cy;
}
function paint(){
  if(!T.base)return;
  const si=T.sel?T.sel[0]*COLS+T.sel[1]:-1;
  for(let i=0;i<8*COLS;i++){T.col.setHex(i===si?0xFF0001:T.hov===i?0xffb0b0:0x8d8d96);T.base.setColorAt(i,T.col);T.back.setColorAt(i,T.col)}
  T.base.instanceColor.needsUpdate=T.back.instanceColor.needsUpdate=true;
}
function resize(){
  const h=$("#v3");if(!T.r||!h)return;
  T.w=h.clientWidth;T.h=h.clientHeight;T.r.setSize(T.w,T.h,false);T.cam.aspect=T.w/T.h;T.cam.updateProjectionMatrix();
  T.iw=Math.round(Math.min(260,T.w*.36));T.ih=Math.round(T.iw*9/16);
  const b=$("#inb");b.style.width=T.iw+"px";b.style.height=T.ih+"px";
}
function ui(){
  const v=$("#vbar");if(!v||!T.r)return;
  T.r.domElement.style.touchAction=T.mode==="seat"?"none":"pan-y";
  v.innerHTML=T.mode==="seat"&&T.sel
    ?`<span>내 시야 · ${ROWS[T.sel[0]]}${T.sel[1]+1} · 드래그로 둘러보기</span><button onclick="viewOver()">전체 보기</button>`
    :`<span>좌석에 마우스를 올리면 시야 미리보기, 클릭하면 그 자리로 이동해요</span>`;
}
function open3D(){
  if(T.ok===false)return;
  const host=$("#v3");
  if(!T.r){try{init3D();host.prepend(T.r.domElement)}catch(e){T.ok=false;T.r=null;host.innerHTML='<div class="v3err">이 기기에서는 3D를 불러올 수 없어요</div>';return}}
  T.mode="over";T.sel=null;T.last=null;T.hov=null;T.yaw=T.pitch=0;T.cp.copy(T.OVP);T.ct.copy(T.OVL);T.ik=null;
  buildHall(fmt);paint();ui();resize();
}
function loop(){
  requestAnimationFrame(loop);
  const r=T.r;if(!r||page()!=="theater"||!T.w)return;
  const seatM=T.mode==="seat"&&T.sel,ty=T.ty||3.3;
  const tp=seatM?SEYE(T.sel[0],T.sel[1]):T.OVP,tl=seatM?new THREE.Vector3(T.yaw*10,ty+T.pitch*6,-.3):T.OVL;
  T.cp.lerp(tp,.08);T.ct.lerp(tl,.12);T.cam.position.copy(T.cp);T.cam.lookAt(T.ct);
  T.cam.fov+=((seatM?72:55)-T.cam.fov)*.08;T.cam.updateProjectionMatrix();
  r.setScissorTest(false);r.setViewport(0,0,T.w,T.h);r.render(T.sc,T.cam);
  const f=seatM?null:(T.hov!=null?T.hov:T.last),b=$("#inb");
  if(f!=null){
    T.icam.position.copy(SEYE(Math.floor(f/COLS),f%COLS));T.icam.lookAt(0,ty,-.3);
    r.setScissorTest(true);r.setScissor(T.w-T.iw-12,12,T.iw,T.ih);r.setViewport(T.w-T.iw-12,12,T.iw,T.ih);
    r.render(T.sc,T.icam);r.setScissorTest(false);
  }
  const key=String(f);
  if(T.ik!==key){T.ik=key;b.style.display=f==null?"none":"block";if(f!=null)b.innerHTML=`<span>내 시야 · ${sid(f)}</span>`}
}

/* 초기화 */
initStage();drawCuration();drawGrid($("#mg"),movies,"영화");drawGrid($("#sg"),items,"매점");mountHome();showT(fmt);route();
</script>
