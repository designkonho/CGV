<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CGV 리디자인 (Copy)</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --hd: #d9d9d9;
      --ph: #ababab;
      --soft: #d9d9d9;
      --card: #fff;
      --dim: rgba(0, 0, 0, 0.6);
      --red: #e71a0f;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161616;
        --fg: #f2f2f2;
        --hd: #2a2a2a;
        --ph: #4a4a4a;
        --soft: #3a3a3a;
        --card: #222;
        --dim: rgba(0, 0, 0, 0.7);
      }
    }

    :root[data-theme="dark"] {
      --bg: #161616;
      --fg: #f2f2f2;
      --hd: #2a2a2a;
      --ph: #4a4a4a;
      --soft: #3a3a3a;
      --card: #222;
      --dim: rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Noto Sans KR", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      background: var(--hd);
      z-index: 30;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    /* Header & Navigation */
    header {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      height: 64px;
      background: var(--hd);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 뒤로가기 버튼 */
    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-back:hover {
      background: rgba(0, 0, 0, 0.16);
    }

    .btn-back.hidden {
      display: none;
    }

    /* 로고 이미지 영역 */
    .logo-btn {
      display: flex;
      align-items: center;
      padding: 0;
    }

    .logo-img {
      height: 32px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      padding: 8px 10px;
      font-size: 14px;
      border-radius: 6px;
    }

    nav button:hover,
    nav button.on {
      background: rgba(128, 128, 128, 0.25);
    }

    /* Common Components */
    .ph {
      background: var(--ph);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 500;
      color: #fff;
      padding: 8px;
    }

    section.page {
      display: none;
      min-height: calc(100vh - 64px);
    }

    section.page.on {
      display: block;
    }

    /* Home Carousel Stage (smooth animations) */
    .stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 16px 40px;
      min-height: 560px;
      overflow: hidden;
    }

    .stage-track {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 부드러운 트랜지션을 위한 카드 스타일 */
    .stage .ph {
      position: absolute;
      width: clamp(70px, 11vw, 168px);
      aspect-ratio: 7 / 10;
      cursor: pointer;
      font-size: 13px;
      border-radius: 12px;
      /* 부드러운 전환 효과 핵심 */
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  width 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                  opacity 0.4s ease,
                  box-shadow 0.4s ease;
      opacity: 0;
      pointer-events: none;
      transform: translateX(0) scale(0.8);
      z-index: 1;
    }

    .stage .ph[data-pos="-2"] {
      transform: translateX(-260px) scale(0.85);
      opacity: 0.4;
      pointer-events: auto;
    }

    .stage .ph[data-pos="-1"] {
      transform: translateX(-140px) scale(0.95);
      opacity: 0.75;
      pointer-events: auto;
      z-index: 2;
    }

    .stage .ph[data-pos="0"] {
      width: clamp(110px, 17vw, 256px);
      aspect-ratio: 256 / 362;
      font-size: 18px;
      transform: translateX(0) scale(1);
      opacity: 1;
      pointer-events: auto;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      z-index: 5;
    }

    .stage .ph[data-pos="1"] {
      transform: translateX(140px) scale(0.95);
      opacity: 0.75;
      pointer-events: auto;
      z-index: 2;
    }

    .stage .ph[data-pos="2"] {
      transform: translateX(260px) scale(0.85);
      opacity: 0.4;
      pointer-events: auto;
    }

    .ctl {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding-bottom: 60px;
    }

    .ctl button,
    .pill {
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--hd);
      font-size: 14px;
      transition: background 0.2s, color 0.2s;
    }

    .ctl button:hover,
    .pill:hover {
      background: var(--red);
      color: #fff;
    }

    .dark {
      background: #000;
      color: #fff;
    }

    .hero {
      padding: 80px 16px 0;
    }

    .screen {
      width: min(1074px, 100%);
      aspect-ratio: 1074 / 566;
      margin: 0 auto;
      background: #ababab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #000;
      cursor: pointer;
      transition: all 0.4s;
    }

    .tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px clamp(16px, 3.5vw, 48px);
      padding: 36px 16px 60px;
    }

    .tabs button {
      font-size: clamp(16px, 2.2vw, 30px);
      color: #999;
      padding: 6px 4px;
      border-bottom: 2px solid transparent;
    }

    .tabs button:hover {
      color: #ddd;
    }

    .tabs button.on {
      color: #fff;
      border-color: var(--red);
    }

    /* Grid Layouts */
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 56px 24px 100px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: clamp(12px, 3vw, 40px) clamp(10px, 2.5vw, 32px);
      align-items: end;
    }

    .grid .ph {
      aspect-ratio: 108 / 152;
      cursor: pointer;
      transition: transform 0.2s;
      font-size: 14px;
      border-radius: 8px;
    }

    .grid .ph:hover {
      transform: translateY(-6px);
    }

    .grid .ph.big {
      grid-column: 3;
      grid-row: 1;
      aspect-ratio: 164 / 231;
      font-size: 20px;
    }

    .grid .ph:nth-child(1) {
      grid-row: 1;
    }

    .grid.feat {
      padding-top: 90px;
    }

    .h {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 0;
      font-size: 22px;
      font-weight: 700;
    }

    /* Theater View */
    .th {
      background: #000;
      min-height: calc(100vh - 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 56px;
      overflow: hidden;
      position: relative;
    }

    .th .stagebox {
      position: relative;
      width: 100%;
      height: min(56vh, 460px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .th .screen {
      cursor: default;
      width: var(--w, 50%);
      height: var(--h, 100%);
      aspect-ratio: auto;
      font-size: 26px;
      margin: 0;
      position: relative;
      z-index: 2;
      border: 3px solid #000;
      transition: width 0.4s ease, height 0.4s ease;
    }

    .wing {
      position: absolute;
      top: 50%;
      width: 18%;
      height: 90%;
      background: #ababab;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .wing.l {
      left: 0;
      clip-path: polygon(0 0, 100% 18%, 100% 82%, 0 100%);
      transform: translateY(-50%);
    }

    .wing.r {
      right: 0;
      clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 82%);
      transform: translateY(-50%);
    }

    .th.sx .wing {
      opacity: 1;
    }

    .desc {
      color: #bbb;
      font-size: 15px;
      text-align: center;
      min-height: 24px;
      padding: 0 16px;
    }

    /* Modal Overlay */
    .ov {
      position: fixed;
      inset: 0;
      background: var(--dim);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 16px;
    }

    .ov.on {
      display: flex;
    }

    .modal {
      background: var(--card);
      border-radius: 24px;
      width: min(880px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 40px;
      position: relative;
      animation: up 0.25s;
    }

    @keyframes up {
      from {
        transform: translateY(24px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal {
        animation: none;
      }
      * {
        transition: none !important;
      }
    }

    .x {
      position: absolute;
      right: 16px;
      top: 12px;
      font-size: 28px;
      line-height: 1;
      padding: 6px 10px;
    }

    .top {
      display: flex;
      gap: 32px;
    }

    .top .ph {
      width: 210px;
      aspect-ratio: 210 / 297;
      flex: none;
      border-radius: 8px;
    }

    .info {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .info h2 {
      margin: 0 0 6px;
      font-size: 26px;
    }

    .info p {
      margin: 0;
      color: #888;
    }

    .acts {
      display: flex;
      gap: 14px;
      margin-top: auto;
      padding-top: 20px;
    }

    .circ {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--soft);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    button.circ:hover,
    button.circ.on {
      background: var(--red);
      color: #fff;
    }

    .body {
      margin: 36px 0 28px;
      line-height: 1.75;
      max-width: 70ch;
    }

    .cast {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .cast div {
      text-align: center;
      font-size: 12px;
    }

    .cast .circ {
      width: 92px;
      height: 92px;
      margin-bottom: 6px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translate(-50%, 40px);
      background: #222;
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      opacity: 0;
      transition: 0.3s;
      z-index: 60;
      pointer-events: none;
    }

    .toast.on {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Mobile Responsive */
    @media (max-width: 700px) {
      header {
        padding: 0 12px;
      }
      nav button {
        padding: 6px;
        font-size: 12px;
      }
      .logo-img {
        height: 26px;
      }
      .top {
        flex-direction: column;
      }
      .top .ph {
        width: 60%;
      }
      .modal {
        padding: 24px;
      }
      .stage .ph[data-pos="-2"],
      .stage .ph[data-pos="2"] {
        opacity: 0;
      }
      .stage .ph[data-pos="-1"] {
        transform: translateX(-90px) scale(0.85);
      }
      .stage .ph[data-pos="1"] {
        transform: translateX(90px) scale(0.85);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <!-- 뒤로가기 버튼 -->
      <button class="btn-back hidden" id="btnBack" onclick="goBack()" aria-label="이전 페이지로">‹ 뒤로</button>
      
      <!-- 로고 (이미지 경로 src 속성에 적용 가능) -->
      <button class="logo-btn" onclick="go('home')" aria-label="홈으로">
        <img class="logo-img" src="logo.png" alt="CGV" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="logo-fallback" style="display:none; font-size:22px; font-weight:700;">LOGO</span>
      </button>
    </div>

    <!-- 네비게이션 (씨네톡 삭제 완료) -->
    <nav>
      <button data-n="my">내 예매/예약</button>
      <button data-n="store">매점</button>
      <button data-n="profile">프로필</button>
    </nav>
  </header>

  <!-- 홈 페이지 -->
  <section class="page" id="home">
    <div class="stage">
      <div class="stage-track" id="stageTrack"></div>
    </div>
    <div class="ctl">
      <button onclick="rot(-1)" aria-label="이전">‹ 이전</button>
      <button onclick="go('movies')">전체 영화 보기</button>
      <button onclick="rot(1)" aria-label="다음">다음 ›</button>
    </div>
    <div class="th" id="thHome" style="min-height:0; padding:80px 0 64px"></div>
  </section>

  <!-- 영화 목록 페이지 -->
  <section class="page" id="movies">
    <div class="h">상영 중인 영화</div>
    <div class="grid feat" id="mg"></div>
  </section>

  <!-- 특별관 정보 페이지 -->
  <section class="page" id="theater">
    <div class="th" id="thPage"></div>
  </section>

  <!-- 매점 페이지 -->
  <section class="page" id="store">
    <div class="h">매점</div>
    <div class="grid" id="sg" style="padding-top:24px"></div>
  </section>

  <!-- 모달 & 토스트 -->
  <div class="ov" id="ov">
    <div class="modal" id="md" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /* Data Settings */
    const movies = [
      "파이널 컷", "밤의 항로", "서울 1999", "바다가 닿는 곳", "별을 세는 사람",
      "마지막 상영관", "여름의 끝", "비밀 정원", "도시의 빛", "첫눈",
      "검은 파도", "소란한 하루", "오후 세 시", "낯선 이웃", "종이 달"
    ].map((t, i) => ({
      id: i,
      t,
      sub: ["드라마 · 118분", "스릴러 · 104분", "범죄 · 126분", "로맨스 · 112분", "SF · 135분"][i % 5],
      d: "예고편에서 다 보여주지 않은 이야기. 극장에서 가장 잘 보이도록 만든 작품으로, 줄거리 소개 영역에 들어갈 샘플 텍스트입니다. 실제 서비스에서는 시놉시스가 여기에 표시됩니다."
    }));

    const cast = ["배우 A", "배우 B", "배우 C", "감독"];

    const items = [
      "팝콘 L", "콤보 A", "콤보 B", "나초", "오징어", "핫도그", "콜라", "탄산 M",
      "아이스티", "커피", "츄러스", "젤리", "초코볼", "물", "에이드", "스낵 세트",
      "키즈 세트", "굿즈 컵", "스페셜 팩", "기프티콘"
    ].map((t, i) => ({
      t,
      sub: (3000 + i * 700).toLocaleString() + "원",
      d: "극장 매점 인기 메뉴입니다. 상영관 입장 전에 미리 주문하고 픽업하세요. 샘플 설명 영역입니다."
    }));

    const fmts = {
      laser: ["laser", "선명한 레이저 영사로 더 깊은 검정과 밝은 화면", { w: "50%", h: "100%" }],
      IMAX: ["IMAX", "더 크고 높은 화면비로 장면 가득 몰입", { w: "62%", h: "100%" }],
      SCREENX: ["SCREENX", "정면과 좌우 벽면까지 이어지는 270° 화면", { w: "60%", h: "85%" }],
      "4DX": ["4DX", "움직이는 좌석과 바람·향기 효과", { w: "90%", h: "100%" }],
      "Dolby Atmos": ["Dolby Atmos", "머리 위까지 움직이는 입체 사운드", { w: "60%", h: "100%" }],
      SOUNDX: ["SOUNDX", "공간 전체를 채우는 사운드 시스템", { w: "60%", h: "100%" }],
      PRESTIGE: ["PRESTIGE", "프리미엄 좌석과 라운지 서비스", { w: "70%", h: "100%" }]
    };

    const $ = s => document.querySelector(s);
    let cur = 2;
    let fmt = "IMAX";

    /* Routing & History Back Support */
    function go(p) {
      location.hash = p;
    }

    function goBack() {
      if (history.length > 1) {
        history.back();
      } else {
        go('home');
      }
    }

    function route() {
      let p = location.hash.slice(1);
      if (!["home", "movies", "theater", "store"].includes(p)) p = "home";

      document.querySelectorAll(".page").forEach(e => e.classList.toggle("on", e.id === p));
      document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.n === p));
      
      // 홈 화면이 아닐 경우 뒤로가기 버튼 표시
      const btnBack = $("#btnBack");
      if (p === "home") {
        btnBack.classList.add("hidden");
      } else {
        btnBack.classList.remove("hidden");
      }

      closeM();
      scrollTo(0, 0);
    }

    addEventListener("hashchange", route);

    document.querySelectorAll("nav button").forEach(b => {
      b.onclick = () => {
        const n = b.dataset.n;
        if (n === "store") go("store");
        else toast({
          my: "내 예매/예약 내역은 로그인 후 확인할 수 있어요",
          profile: "프로필은 로그인 후 확인할 수 있어요"
        }[n]);
      };
    });

    /* Toast Notification Utility */
    let tt;
    function toast(m) {
      const t = $("#toast");
      t.textContent = m;
      t.classList.add("on");
      clearTimeout(tt);
      tt = setTimeout(() => t.classList.remove("on"), 2200);
    }

    /* Smooth Carousel Stage Initialization & Update */
    function initStage() {
      const track = $("#stageTrack");
      track.innerHTML = "";
      
      // 모든 카드 엘리먼트를 생성 후 위치 업데이트
      movies.forEach((m, idx) => {
        const b = document.createElement("button");
        b.className = "ph";
        b.textContent = m.t;
        b.setAttribute("aria-label", m.t);
        b.dataset.id = idx;
        track.appendChild(b);
      });
      updateStage();
    }

    function updateStage() {
      const track = $("#stageTrack");
      const cards = track.querySelectorAll(".ph");
      
      cards.forEach((card) => {
        const idx = parseInt(card.dataset.id, 10);
        let diff = idx - cur;
        
        // Circular index calculation
        if (diff < -Math.floor(movies.length / 2)) diff += movies.length;
        if (diff > Math.floor(movies.length / 2)) diff -= movies.length;
        
        card.setAttribute("data-pos", diff);
        
        const m = movies[idx];
        card.onclick = () => {
          if (diff === 0) {
            openM(m, "영화");
          } else {
            cur = idx;
            updateStage();
          }
        };
      });
    }

    function rot(d) {
      cur = (cur + d + movies.length) % movies.length;
      updateStage();
    }

    addEventListener("keydown", e => {
      if (e.key === "Escape") closeM();
      if ($("#home").classList.contains("on") && !$("#ov").classList.contains("on")) {
        if (e.key === "ArrowLeft") rot(-1);
        if (e.key === "ArrowRight") rot(1);
      }
    });

    /* Format Tabs Component */
    const TABS = ["laser", "IMAX", "SCREENX", "4DX", "Dolby Atmos"];

    function mounts() {
      document.querySelectorAll(".th").forEach(el => {
        const home = el.id === "thHome";
        el.innerHTML = `
          <div class="stagebox">
            <div class="wing l"></div>
            <div class="screen" ${home ? 'role="button" tabindex="0" aria-label="특별관 자세히 보기"' : ''}></div>
            <div class="wing r"></div>
          </div>
          <div class="desc"></div>
          <div class="tabs" style="padding:0 16px"></div>
        `;
        
        const sc = el.querySelector(".screen");
        const t = el.querySelector(".tabs");

        TABS.forEach(k => {
          const b = document.createElement("button");
          b.textContent = k;
          b.dataset.k = k;
          b.onclick = () => showT(k);
          t.appendChild(b);
        });

        if (home) {
          sc.style.cursor = "pointer";
          sc.onclick = () => go("theater");
          sc.onkeydown = e => { if (e.key === "Enter") go("theater"); };
        }
      });
    }

    function showT(k) {
      fmt = k;
      const f = fmts[k];
      document.querySelectorAll(".th").forEach(el => {
        const s = el.querySelector(".screen");
        s.style.setProperty("--w", f[2].w);
        s.style.setProperty("--h", f[2].h);
        s.textContent = f[0];
        el.classList.toggle("sx", k === "SCREENX");
        el.querySelector(".desc").textContent = f[1];
        el.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
      });
    }

    /* Render Grid Lists */
    function drawMovies() {
      const g = $("#mg");
      g.innerHTML = "";
      movies.forEach((m, i) => {
        const b = document.createElement("button");
        b.className = "ph" + (i === 2 ? " big" : "");
        b.textContent = m.t;
        b.onclick = () => openM(m, "영화");
        g.appendChild(b);
      });
    }

    function drawStore() {
      const g = $("#sg");
      g.innerHTML = "";
      items.forEach(m => {
        const b = document.createElement("button");
        b.className = "ph";
        b.textContent = m.t;
        b.onclick = () => openM(m, "매점");
        g.appendChild(b);
      });
    }

    /* Modal Operations */
    function openM(m, label) {
      const isM = label === "영화";
      const acts = isM ? ["예매", "찜", "공유", "예고편"] : ["담기", "찜", "공유", "주문"];

      $("#md").innerHTML = `
        <button class="x" aria-label="닫기" onclick="closeM()">×</button>
        <div class="top">
          <div class="ph">${label}<br>${m.t}</div>
          <div class="info">
            <h2>${m.t}</h2>
            <p>${m.sub}</p>
            <div class="acts">
              ${acts.map(a => `<button class="circ" data-a="${a}">${a}</button>`).join("")}
            </div>
          </div>
        </div>
        <p class="body">${m.d}</p>
        <div class="cast">
          ${(isM ? cast : ["옵션 1", "옵션 2", "옵션 3", "옵션 4"]).map(c => `<div><div class="circ"></div>${c}</div>`).join("")}
        </div>
      `;

      $("#md").querySelectorAll("[data-a]").forEach(b => {
        b.onclick = () => {
          const a = b.dataset.a;
          if (a === "찜") {
            b.classList.toggle("on");
            toast(b.classList.contains("on") ? "찜했어요" : "찜을 취소했어요");
          } else if (a === "예매" || a === "주문" || a === "담기") {
            toast(`${m.t} ${a === "예매" ? "예매를 시작해요" : a === "주문" ? "주문을 시작해요" : "장바구니에 담았어요"}`);
          } else if (a === "공유") {
            toast("링크를 복사했어요");
          } else {
            toast("예고편을 불러오는 중이에요");
          }
        };
      });

      $("#ov").classList.add("on");
      $("#md").querySelector(".x").focus();
    }

    function closeM() {
      $("#ov").classList.remove("on");
    }

    $("#ov").onclick = e => {
      if (e.target.id === "ov") closeM();
    };

    /* App Initialization */
    initStage();
    drawMovies();
    drawStore();
    mounts();
    showT(fmt);
    route();
  </script>
</body>
</html>
